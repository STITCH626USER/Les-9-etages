<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>LES 9 ÉTAGES DE LA TOUR — Édition Mobile 3D Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=League+Spartan:wght@800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

<!-- Three.js for Mobile 3D -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

<!-- PDF.js Mozilla -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<script src="book_data.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html {
    width: 100%; height: 100%; overflow: hidden;
    background: #060911; font-family: 'Plus Jakarta Sans', sans-serif;
    color: #f7eedb; user-select: none;
}

/* TOP HEADER */
#m-header {
    height: 56px; width: 100%; background: rgba(10, 14, 23, 0.94);
    backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 15px; position: absolute; top: 0; left: 0; z-index: 100;
}
.m-brand-box { display: flex; align-items: center; gap: 8px; }
.m-title {
    font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: #f7eedb;
}
.m-side-badge {
    padding: 4px 10px; border-radius: 15px; font-size: 9px; font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase; transition: all 0.4s;
}
.m-terrain { background: #c35936; color: #fff; }
.m-sommet { background: #133968; color: #dfb256; }

.m-header-actions { display: flex; align-items: center; gap: 6px; }
.m-btn-glass {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #dfb256; padding: 6px 10px; border-radius: 18px; font-size: 11px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; gap: 4px;
}
.m-btn-flip {
    background: linear-gradient(135deg, #c35936 0%, #dfb256 100%);
    color: #111; font-weight: 900; font-size: 11px; border: none;
    padding: 6px 12px; border-radius: 20px; cursor: pointer;
    box-shadow: 0 2px 12px rgba(223, 178, 86, 0.4);
}

/* 3D WEBGL FULLSCREEN MOBILE STAGE */
#m-stage-3d {
    width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 5;
    touch-action: none;
}

/* 3D HOME CTA & HINT */
#m-home-ui {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    z-index: 20; width: 90%; max-width: 320px; text-align: center;
}
.m-hero-hint {
    font-size: 11px; font-weight: 600; color: #889bb8;
    background: rgba(14, 20, 32, 0.85); backdrop-filter: blur(10px);
    padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
}
.m-hero-cta {
    background: #dfb256; color: #111; font-size: 14px; font-weight: 900;
    padding: 12px 28px; border-radius: 25px; border: none; cursor: pointer;
    box-shadow: 0 6px 25px rgba(223, 178, 86, 0.5); width: 100%;
}

/* 2D MOBILE LISEUSE PRO (PAGE SIMPLE A5 + 3D PAGE CURL) */
#m-reader-overlay {
    position: absolute; top: 56px; left: 0; width: 100%; height: calc(100% - 56px);
    display: none; justify-content: center; align-items: center;
    background: radial-gradient(circle at center, #111726 0%, #05070c 100%);
    backdrop-filter: blur(25px); z-index: 90;
    overflow: hidden;
}

.m-perspective-stage {
    perspective: 1800px;
    width: 100%; height: 100%; display: flex;
    justify-content: center; align-items: center; padding: 12px;
}

.m-single-page-card {
    background: #fff; border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.85);
    overflow: hidden; max-height: 82vh; max-width: 92vw;
    display: flex; justify-content: center; align-items: center;
    position: relative; transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
}

.m-single-page-card canvas {
    max-height: 82vh; max-width: 92vw; width: auto; height: auto; display: block;
}

/* RUBAN MARQUE-PAGE EN COIN */
#m-bookmark-ribbon {
    position: absolute; top: 0; right: 20px; width: 24px; height: 38px;
    background: #dfb256; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.4); display: none; z-index: 30;
    cursor: pointer;
}

/* LISEUSE 3D CURL ANIMATIONS (PROPRE ET NATURELLE) */
.m-single-page-card.flip-next-curl {
    animation: mobileCurlNext 0.42s cubic-bezier(0.25, 1, 0.5, 1);
}
.m-single-page-card.flip-prev-curl {
    animation: mobileCurlPrev 0.42s cubic-bezier(0.25, 1, 0.5, 1);
}
.m-single-page-card.mobile-sommet-spin {
    animation: mobileSommetSpin 1.1s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes mobileCurlNext {
    0% { transform: rotateY(0deg) scale(1); opacity: 1; }
    50% { transform: rotateY(-35deg) scale(0.95) skewY(2deg); opacity: 0.9; box-shadow: -20px 20px 50px rgba(0,0,0,0.8); }
    100% { transform: rotateY(0deg) scale(1); opacity: 1; }
}
@keyframes mobileCurlPrev {
    0% { transform: rotateY(0deg) scale(1); opacity: 1; }
    50% { transform: rotateY(35deg) scale(0.95) skewY(-2deg); opacity: 0.9; box-shadow: 20px 20px 50px rgba(0,0,0,0.8); }
    100% { transform: rotateY(0deg) scale(1); opacity: 1; }
}
@keyframes mobileSommetSpin {
    0% { transform: rotateZ(0deg) rotateY(0deg) scale(1); }
    50% { transform: rotateZ(90deg) rotateY(90deg) scale(0.75); }
    100% { transform: rotateZ(0deg) rotateY(0deg) scale(1); }
}

/* TAP ZONES */
.m-tap-zones {
    position: absolute; width: 100%; height: 100%; top: 0; left: 0;
    display: flex; z-index: 40; pointer-events: auto;
}
.tap-left { width: 30%; height: 100%; }
.tap-center { width: 40%; height: 100%; }
.tap-right { width: 30%; height: 100%; }

/* AUTO-FADE DOCK BAR */
#m-dock-bar {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: 92%; max-width: 380px; height: 50px;
    background: rgba(14, 20, 32, 0.94); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 30px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 14px; z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    opacity: 0.2; transition: opacity 0.4s ease, transform 0.3s ease;
}
#m-dock-bar:hover, #m-dock-bar.active {
    opacity: 1; transform: translateX(-50%) translateY(-2px);
}

.m-ctrl-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    color: #f7eedb; padding: 6px 12px; border-radius: 15px; font-size: 11px;
    font-weight: 700; cursor: pointer;
}
.m-slider-bar {
    flex: 1; margin: 0 10px; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 4px; background: rgba(255,255,255,0.2); outline: none;
}
.m-slider-bar::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: #dfb256; cursor: pointer;
}
#m-page-display { font-size: 11px; font-weight: 800; color: #dfb256; min-width: 52px; text-align: center; }

/* TOAST POP */
#m-toast-pop {
    position: absolute; top: 65px; left: 50%; transform: translateX(-50%);
    background: #dfb256; color: #111; font-weight: 800; font-size: 11px;
    padding: 7px 18px; border-radius: 20px; display: none; z-index: 300;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<div id="m-toast-pop">Page mémorisée !</div>

<!-- TOP HEADER -->
<div id="m-header">
    <div class="m-brand-box">
        <span class="m-title">9 ÉTAGES</span>
        <span id="m-side-badge" class="m-side-badge m-terrain">TERRAIN</span>
    </div>

    <div class="m-header-actions">
        <button id="m-btn-bm" class="m-btn-glass" onclick="toggleBookmark()" title="Marquer cette page">
            🔖 <span id="m-bm-text">Marquer</span>
        </button>
        <button id="m-btn-toggle" class="m-btn-glass" onclick="toggleReadingMode()">📖 Lire</button>
        <button class="m-btn-flip" onclick="animateMobile3DTeteBeche()">🔄 RETOURNER</button>
    </div>
</div>

<!-- 3D MOBILE STAGE -->
<div id="m-stage-3d"></div>

<!-- 3D HOME CALLOUTS -->
<div id="m-home-ui">
    <div class="m-hero-hint">👆 Touchez & glissez dans toutes les directions pour manipuler en 3D</div>
    <button class="m-hero-cta" onclick="toggleReadingMode()">
        OUVRIR LE LIVRE ➔
    </button>
</div>

<!-- 2D MOBILE LISEUSE OVERLAY -->
<div id="m-reader-overlay">
    <div class="m-perspective-stage">
        <div id="m-card-wrap" class="m-single-page-card">
            <div id="m-bookmark-ribbon" onclick="toggleBookmark()" title="Retirer marque-page"></div>
            <canvas id="m-page-canvas"></canvas>
        </div>
    </div>

    <!-- TOUCH SWIPE & TAP ZONES -->
    <div class="m-tap-zones">
        <div class="tap-left" onclick="prevPage()"></div>
        <div class="tap-center" onclick="toggleDockBar()"></div>
        <div class="tap-right" onclick="nextPage()"></div>
    </div>

    <!-- AUTO-FADE DOCK -->
    <div id="m-dock-bar">
        <button class="m-ctrl-btn" onclick="prevPage()">◀</button>
        <input type="range" id="m-page-slider" class="m-slider-bar" min="1" max="168" value="1" oninput="onMobileSlider(this.value)" />
        <span id="m-page-display">p. 1 / 168</span>
        <button class="m-ctrl-btn" onclick="nextPage()">▶</button>
    </div>
</div>

<script>
const STORAGE_KEY = "LES_9_ETAGES_MOBILE_SESSION";

let currentSide = 'terrain';
let docTerrain = null;
let docSommet = null;
let currentPage = 1;
let isReading = false;
let dockTimer = null;
let touchStartX = 0, touchEndX = 0;

let scene, camera, renderer, bookMesh;
let isFlipping3D = false;
let isTouchDragging = false;
let prevTouchPos = { x: 0, y: 0 };

function initMobile3D() {
    const container = document.getElementById('m-stage-3d');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 9.2);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const lKey = new THREE.DirectionalLight(0xffffff, 0.95);
    lKey.position.set(5, 8, 7); scene.add(lKey);
    const lRim = new THREE.DirectionalLight(0xdfb256, 0.6);
    lRim.position.set(-5, -4, 5); scene.add(lRim);

    const geometry = new THREE.BoxGeometry(3.2, 4.5, 0.52);
    const loader = new THREE.TextureLoader();
    const tCover = loader.load(window.BOOK_DATA.terrainCover);
    const sCover = loader.load(window.BOOK_DATA.sommetCover);
    sCover.center.set(0.5, 0.5);
    sCover.rotation = Math.PI;

    const canvasP = document.createElement('canvas');
    canvasP.width = 128; canvasP.height = 512;
    const ctxP = canvasP.getContext('2d');
    ctxP.fillStyle = '#f6f0df'; ctxP.fillRect(0,0,128,512);
    ctxP.fillStyle = '#d8cca8';
    for(let i=0; i<512; i+=4) ctxP.fillRect(0, i, 128, 1.5);
    const pTex = new THREE.CanvasTexture(canvasP);

    const canvasS = document.createElement('canvas');
    canvasS.width = 256; canvasS.height = 1024;
    const ctxS = canvasS.getContext('2d');
    ctxS.fillStyle = '#111a2d'; ctxS.fillRect(0,0,256,512);
    ctxS.fillStyle = '#c35936'; ctxS.fillRect(0,512,256,512);
    ctxS.fillStyle = '#dfb256'; ctxS.font = 'bold 36px sans-serif'; ctxS.textAlign = 'center';
    
    ctxS.save(); ctxS.translate(128, 256); ctxS.rotate(Math.PI/2);
    ctxS.fillText("▲ SOMMET · 9 ÉTAGES", 0, 12); ctxS.restore();

    ctxS.save(); ctxS.translate(128, 768); ctxS.rotate(-Math.PI/2);
    ctxS.fillStyle = '#f7eedb'; ctxS.fillText("▲ TERRAIN · 9 ÉTAGES", 0, 12); ctxS.restore();
    const spineTex = new THREE.CanvasTexture(canvasS);

    const materials = [
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: spineTex }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: tCover, roughness: 0.35 }),
        new THREE.MeshStandardMaterial({ map: sCover, roughness: 0.35 })
    ];

    bookMesh = new THREE.Mesh(geometry, materials);
    bookMesh.rotation.set(0.15, -0.35, 0);
    scene.add(bookMesh);

    const dom = renderer.domElement;
    dom.addEventListener('touchstart', (e) => {
        isTouchDragging = true;
        prevTouchPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });

    dom.addEventListener('touchmove', (e) => {
        if (!isTouchDragging) return;
        const deltaX = e.touches[0].clientX - prevTouchPos.x;
        const deltaY = e.touches[0].clientY - prevTouchPos.y;

        const deltaQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(
            deltaY * 0.01,
            deltaX * 0.01,
            0,
            'XYZ'
        ));
        bookMesh.quaternion.multiplyQuaternions(deltaQuat, bookMesh.quaternion);
        prevTouchPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });

    dom.addEventListener('touchend', () => { isTouchDragging = false; });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animateMobile();
    loadStoredMobileSession();
    initPDFs();
}

function animateMobile(time) {
    requestAnimationFrame(animateMobile);
    TWEEN.update(time);
    if (!isFlipping3D && bookMesh && !isReading) {
        bookMesh.position.y = Math.sin(time * 0.0015) * 0.08;
    }
    renderer.render(scene, camera);
}

function animateMobile3DTeteBeche() {
    if (isFlipping3D) return;
    isFlipping3D = true;

    currentSide = (currentSide === 'terrain') ? 'sommet' : 'terrain';
    currentPage = (currentSide === 'terrain') ? (sessionData.terrainLastPage || 1) : (sessionData.sommetLastPage || 1);

    const targetY = (currentSide === 'sommet') ? Math.PI - 0.35 : -0.35;
    const targetZ = (currentSide === 'sommet') ? Math.PI : 0;

    new TWEEN.Tween(bookMesh.rotation)
        .to({ y: targetY, z: targetZ, x: 0.15 }, 1200)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onComplete(() => { isFlipping3D = false; })
        .start();

    updateBadgeUI();

    if (isReading) {
        renderPageMobile('sommet-spin');
    }
}

let sessionData = {
    terrainLastPage: 1,
    sommetLastPage: 1,
    terrainBookmarks: [],
    sommetBookmarks: []
};

function loadStoredMobileSession() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            sessionData = JSON.parse(saved);
            currentPage = (currentSide === 'terrain') ? (sessionData.terrainLastPage || 1) : (sessionData.sommetLastPage || 1);
        } catch(e) {}
    }
}

function persistMobileSession() {
    if (currentSide === 'terrain') sessionData.terrainLastPage = currentPage;
    else sessionData.sommetLastPage = currentPage;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessionData));
    checkBookmark();
}

async function initPDFs() {
    docTerrain = await pdfjsLib.getDocument('terrain.pdf').promise;
    docSommet = await pdfjsLib.getDocument('sommet.pdf').promise;
    setupTouchLiseuse();
}

async function renderPageMobile(anim = null) {
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    if (!activeDoc) return;

    const card = document.getElementById('m-card-wrap');
    card.classList.remove('flip-next-curl', 'flip-prev-curl', 'mobile-sommet-spin');
    void card.offsetWidth;

    if (anim === 'next') card.classList.add('flip-next-curl');
    else if (anim === 'prev') card.classList.add('flip-prev-curl');
    else if (anim === 'sommet-spin') card.classList.add('mobile-sommet-spin');

    const page = await activeDoc.getPage(currentPage);
    const canvas = document.getElementById('m-page-canvas');
    const ctx = canvas.getContext('2d');
    
    const viewport = page.getViewport({ scale: 2.4 });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    
    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

    document.getElementById('m-page-slider').value = currentPage;
    document.getElementById('m-page-display').innerText = `p. ${currentPage} / 168`;

    persistMobileSession();
    wakeDockBar();
}

function nextPage() {
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    if (activeDoc && currentPage < activeDoc.numPages) {
        currentPage++;
        renderPageMobile('next');
    }
}

function prevPage() {
    if (currentPage > 1) {
        currentPage--;
        renderPageMobile('prev');
    }
}

function onMobileSlider(val) {
    currentPage = parseInt(val);
    renderPageMobile();
}

function updateBadgeUI() {
    const b = document.getElementById('m-side-badge');
    if (currentSide === 'terrain') {
        b.className = "m-side-badge m-terrain";
        b.innerText = "TERRAIN";
    } else {
        b.className = "m-side-badge m-sommet";
        b.innerText = "SOMMET";
    }
}

function toggleBookmark() {
    const list = (currentSide === 'terrain') ? sessionData.terrainBookmarks : sessionData.sommetBookmarks;
    const idx = list.indexOf(currentPage);
    if (idx === -1) {
        list.push(currentPage);
        showToast(`🔖 Page ${currentPage} mémorisée !`);
    } else {
        list.splice(idx, 1);
        showToast(`Marque-page retiré`);
    }
    persistMobileSession();
}

function checkBookmark() {
    const list = (currentSide === 'terrain') ? sessionData.terrainBookmarks : sessionData.sommetBookmarks;
    const isBm = list.includes(currentPage);
    document.getElementById('m-bookmark-ribbon').style.display = isBm ? 'block' : 'none';
    document.getElementById('m-bm-text').innerText = isBm ? 'Mémorisée ★' : 'Marquer';
}

function showToast(txt) {
    const t = document.getElementById('m-toast-pop');
    t.innerText = txt; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2200);
}

function toggleReadingMode() {
    isReading = !isReading;
    document.getElementById('m-reader-overlay').style.display = isReading ? 'flex' : 'none';
    document.getElementById('m-home-ui').style.display = isReading ? 'none' : 'flex';
    document.getElementById('m-btn-toggle').innerText = isReading ? '🧊 3D' : '📖 Lire';
    if (isReading) renderPageMobile();
}

function setupTouchLiseuse() {
    const vp = document.getElementById('m-reader-overlay');
    vp.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        wakeDockBar();
    }, { passive: true });

    vp.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (diff < -45) nextPage();
        if (diff > 45) prevPage();
    }, { passive: true });
}

function wakeDockBar() {
    const bar = document.getElementById('m-dock-bar');
    bar.classList.add('active');
    clearTimeout(dockTimer);
    dockTimer = setTimeout(() => { bar.classList.remove('active'); }, 3500);
}

function toggleDockBar() {
    document.getElementById('m-dock-bar').classList.toggle('active');
}

window.onload = initMobile3D;
</script>
</body>
</html>
