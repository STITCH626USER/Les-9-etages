<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LES 9 ÉTAGES DE LA TOUR — Édition Mobile 9:16</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=League+Spartan:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<!-- Three.js for 3D Stage -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

<!-- PDF.js Mozilla -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<script src="book_data.js"></script>
<script src="book_text.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html {
    width: 100%; height: 100%; overflow: hidden;
    background: #080b13; font-family: 'Plus Jakarta Sans', sans-serif;
    color: #f7eedb; user-select: none; -webkit-tap-highlight-color: transparent;
}

/* TOP HEADER FIXE & LISIBLE */
#m-header {
    height: 54px; width: 100%; background: #0c101c;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 12px; position: fixed; top: 0; left: 0; z-index: 200;
}
.brand-zone { display: flex; align-items: center; gap: 6px; }
.title-txt {
    font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700;
    letter-spacing: 1px; color: #f7eedb;
}
.side-pill {
    padding: 3px 8px; border-radius: 10px; font-size: 9px; font-weight: 800;
    text-transform: uppercase;
}
.pill-terrain { background: #c35936; color: #fff; }
.pill-sommet { background: #133968; color: #dfb256; }

.header-btns { display: flex; align-items: center; gap: 6px; }
.btn-h {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #f7eedb; padding: 6px 10px; border-radius: 14px; font-size: 11px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 4px;
}
.btn-h.active-bm { background: #dfb256; color: #111; font-weight: 800; }
.btn-flip-act {
    background: linear-gradient(135deg, #c35936, #dfb256);
    color: #111; font-weight: 900; font-size: 11px; border: none;
    padding: 6px 11px; border-radius: 14px; cursor: pointer;
}

/* 3D STAGE FULLSCREEN */
#stage-3d-box {
    width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 5;
    touch-action: none;
}
#home-3d-cta {
    position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 320px; z-index: 20; text-align: center;
    display: flex; flex-direction: column; gap: 10px;
}
.cta-btn-main {
    background: #dfb256; color: #111; font-size: 15px; font-weight: 900;
    padding: 13px 25px; border-radius: 25px; border: none; cursor: pointer;
    box-shadow: 0 8px 25px rgba(223, 178, 86, 0.5); width: 100%;
}

/* =================================================== */
/* VRAIE LISEUSE PLEIN ÉCRAN 9:16 REFLOW DYNAMIQUE */
/* =================================================== */
#live-reader-container {
    position: fixed; top: 54px; left: 0; width: 100%; height: calc(100% - 54px);
    display: none; flex-direction: column; justify-content: space-between;
    background: #0d121f; color: #f7eedb; z-index: 90;
    transition: background 0.3s, color 0.3s;
}

/* THEMES DE LECTURE */
#live-reader-container.theme-dark { background: #0b0f19; color: #f4ecdc; }
#live-reader-container.theme-sepia { background: #f6eedb; color: #36291a; }
#live-reader-container.theme-light { background: #ffffff; color: #181818; }

/* REFLOW SCROLLABLE CONTENT (TEXTE DYNAMIQUE SANS DÉBORDEMENT) */
#live-reader-body {
    flex: 1; width: 100%; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; padding: 18px 20px 75px 20px;
    font-family: 'Lora', serif; line-height: 1.75;
}

/* FORMAT FAC-SIMILÉ PDF (SI MODE EXACT) */
#pdf-facsimile-wrapper {
    width: 100%; height: 100%; display: none;
    justify-content: center; align-items: center; padding: 8px;
}
#pdf-page-card {
    background: #fff; border-radius: 6px; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    max-height: 100%; max-width: 100%; display: flex; justify-content: center; align-items: center;
}
#pdf-page-card canvas {
    max-height: calc(100vh - 130px); max-width: 94vw; width: auto; height: auto; display: block;
}

/* EN-TÊTE DE CHAPITRE REFLOW */
.reflow-chap-title {
    font-family: 'League Spartan', sans-serif; font-size: 13px; font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase; color: #dfb256;
    margin-bottom: 12px; border-bottom: 1px solid rgba(223, 178, 86, 0.3);
    padding-bottom: 6px; display: flex; justify-content: space-between;
}
.reflow-para {
    margin-bottom: 14px; text-align: justify; word-break: break-word;
}
.reflow-table-box {
    margin: 15px 0; padding: 12px; background: rgba(0,0,0,0.15); border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1); font-size: 0.9em; font-family: 'Plus Jakarta Sans', sans-serif;
}

/* TOP TOOLBAR INSIDE READER (TAILLE POLICE A- / A+ ET THÈMES) */
#reader-quick-toolbar {
    height: 38px; width: 100%; background: rgba(0,0,0,0.25);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 15px; font-size: 11px;
}
.font-stepper { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.btn-font-step {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    color: #dfb256; padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: 900;
    cursor: pointer;
}
.theme-selector-dots { display: flex; align-items: center; gap: 8px; }
.theme-dot-btn {
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 1.5px solid rgba(255,255,255,0.3);
}

/* BOTTOM FIXED DOCK (ZÉRO GLITCH) */
#m-bottom-dock {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    width: 94%; max-width: 400px; height: 46px;
    background: rgba(12, 16, 28, 0.96); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 25px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 12px; z-index: 150;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}
.dock-nav-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    color: #f7eedb; padding: 5px 12px; border-radius: 15px; font-size: 11px; font-weight: 800;
    cursor: pointer;
}
.dock-slider-bar {
    flex: 1; margin: 0 10px; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 4px; background: rgba(255,255,255,0.2); outline: none;
}
.dock-slider-bar::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 15px; height: 15px;
    border-radius: 50%; background: #dfb256; cursor: pointer;
}
#page-indicator-txt { font-size: 11px; font-weight: 800; color: #dfb256; min-width: 80px; text-align: center; }

/* MODALS */
#bookmarks-dialog-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(4, 6, 12, 0.85); backdrop-filter: blur(20px);
    display: none; justify-content: center; align-items: center; z-index: 350;
    padding: 20px;
}
.dialog-box {
    background: #111726; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px; padding: 22px 18px; width: 100%; max-width: 340px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9); text-align: center;
}
.dialog-list {
    max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
    margin: 15px 0; text-align: left;
}
.dialog-item {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between;
    align-items: center; cursor: pointer;
}

#toast-box {
    position: fixed; top: 65px; left: 50%; transform: translateX(-50%);
    background: #dfb256; color: #111; font-weight: 800; font-size: 11px;
    padding: 7px 18px; border-radius: 20px; display: none; z-index: 400;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<div id="toast-box">Page mémorisée !</div>

<!-- TOP HEADER -->
<div id="m-header">
    <div class="brand-zone">
        <span class="title-txt">9 ÉTAGES</span>
        <span id="badge-side" class="side-pill pill-terrain">TERRAIN</span>
    </div>

    <div class="header-btns">
        <button id="btn-save-bm" class="btn-h" onclick="toggleCurrentBookmark()">🔖 <span id="txt-bm-label">Marquer</span></button>
        <button class="btn-h" onclick="openBookmarksList()">📂 <span id="txt-bm-total">Pages (0)</span></button>
        <button id="btn-view-mode" class="btn-h" onclick="toggleViewMode()" style="border-color:#dfb256; color:#dfb256;">Aa Texte</button>
        <button class="btn-flip-act" onclick="flip3DTeteBeche()">🔄 RETOURNER</button>
    </div>
</div>

<!-- 3D WEBGL FULLSCREEN STAGE -->
<div id="stage-3d-box"></div>

<!-- 3D HOME CTA -->
<div id="home-3d-cta">
    <div style="font-size:11px; color:#889bb8; background:rgba(12,16,28,0.85); padding:6px 14px; border-radius:15px; border:1px solid rgba(255,255,255,0.1);">
        👆 Touchez & glissez pour manipuler à 360°
    </div>
    <button class="cta-btn-main" onclick="openReader()">
        OUVRIR LE LIVRE ➔
    </button>
</div>

<!-- LIVE REFLOW & PDF DUAL-READER CONTAINER (9:16) -->
<div id="live-reader-container" class="theme-dark">
    
    <!-- SUB-TOOLBAR: DYNAMIC FONT SIZE & THEMES -->
    <div id="reader-quick-toolbar">
        <div class="font-stepper">
            <span>Taille :</span>
            <button class="btn-font-step" onclick="changeFontSize(-2)">A−</button>
            <span id="font-sz-display" style="color:#dfb256;">16px</span>
            <button class="btn-font-step" onclick="changeFontSize(2)">A+</button>
        </div>

        <div class="theme-selector-dots">
            <div class="theme-dot-btn" style="background:#0b0f19; border-color:#dfb256;" onclick="applyTheme('theme-dark')"></div>
            <div class="theme-dot-btn" style="background:#f6eedb;" onclick="applyTheme('theme-sepia')"></div>
            <div class="theme-dot-btn" style="background:#ffffff;" onclick="applyTheme('theme-light')"></div>
        </div>
    </div>

    <!-- 1. LIVE REFLOW BODY (DYNAMIQUE, CENTRÉ, LISIBLE) -->
    <div id="live-reader-body">
        <div class="reflow-chap-title">
            <span id="reflow-header-tag">CÔTÉ TERRAIN · PAGE 1</span>
        </div>
        <div id="reflow-text-zone" style="font-size: 16px;"></div>
    </div>

    <!-- 2. EXACT PDF CANVAS (SI MODE FAC-SIMILÉ) -->
    <div id="pdf-facsimile-wrapper">
        <div id="pdf-page-card">
            <canvas id="pdf-canvas"></canvas>
        </div>
    </div>

    <!-- FIXED NON-GLITCHING BOTTOM DOCK -->
    <div id="m-bottom-dock">
        <button class="dock-nav-btn" onclick="prevStep()">◀</button>
        <input type="range" id="page-scrubber" class="dock-slider-bar" min="1" max="168" value="1" oninput="onScrubPage(this.value)" />
        <span id="page-indicator-txt">Couverture</span>
        <button class="dock-nav-btn" onclick="nextStep()">▶</button>
    </div>
</div>

<!-- BOOKMARKS MODAL -->
<div id="bookmarks-dialog-overlay">
    <div class="dialog-box">
        <div style="font-size:28px; margin-bottom:6px;">🔖</div>
        <h3 style="font-size:16px; color:#dfb256; text-transform:uppercase;">Mes Marque-Pages</h3>
        <p style="font-size:11px; color:#889bb8; margin-bottom:12px;">Accédez instantanément à vos pages</p>
        <div class="dialog-list" id="dialog-bm-items"></div>
        <button onclick="closeBookmarksList()" style="background:#dfb256; color:#111; font-weight:800; font-size:12px; padding:9px 22px; border-radius:20px; border:none; cursor:pointer; width:100%;">Fermer ✕</button>
    </div>
</div>

<script>
const STORAGE_KEY = "LES_9_ETAGES_APP_STORAGE_V3";

let currentSide = 'terrain'; // 'terrain' or 'sommet'
let currentPage = 1; // 1 to 168 (1 = Couverture, 2 = Page 1)
let isReading = false;
let isPdfMode = false; // False = Reflow Dynamique 9:16, True = PDF Facsimile
let currentFontSize = 16;

let docTerrain = null;
let docSommet = null;

// Three.js 3D
let scene, camera, renderer, bookMesh;
let isFlipping3D = false;
let isTouchDragging = false;
let prevTouchPos = { x: 0, y: 0 };

let userStore = {
    terrainLastPage: 1,
    sommetLastPage: 1,
    terrainBookmarks: [],
    sommetBookmarks: [],
    fontSize: 16,
    theme: 'theme-dark',
    lastSide: 'terrain'
};

function loadUserStore() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            userStore = JSON.parse(saved);
            currentSide = userStore.lastSide || 'terrain';
            currentPage = (currentSide === 'terrain') ? (userStore.terrainLastPage || 1) : (userStore.sommetLastPage || 1);
            currentFontSize = userStore.fontSize || 16;
        } catch(e) {}
    }
}

function saveUserStore() {
    if (currentSide === 'terrain') userStore.terrainLastPage = currentPage;
    else userStore.sommetLastPage = currentPage;
    userStore.lastSide = currentSide;
    userStore.fontSize = currentFontSize;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(userStore));
    updateBookmarkUI();
}

function init3DStage() {
    const container = document.getElementById('stage-3d-box');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 9.2);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const lKey = new THREE.DirectionalLight(0xffffff, 0.95);
    lKey.position.set(5, 8, 7); scene.add(lKey);
    const lRim = new THREE.DirectionalLight(0xdfb256, 0.6);
    lRim.position.set(-5, -4, 5); scene.add(lRim);

    const geometry = new THREE.BoxGeometry(3.2, 4.5, 0.52);
    const loader = new THREE.TextureLoader();
    const tCover = loader.load(window.BOOK_DATA.terrainCover);
    const sCover = loader.load(window.BOOK_DATA.sommetCover);
    sCover.center.set(0.5, 0.5);
    sCover.rotation = Math.PI;

    const canvasP = document.createElement('canvas');
    canvasP.width = 128; canvasP.height = 512;
    const ctxP = canvasP.getContext('2d');
    ctxP.fillStyle = '#f6f0df'; ctxP.fillRect(0,0,128,512);
    ctxP.fillStyle = '#d8cca8';
    for(let i=0; i<512; i+=4) ctxP.fillRect(0, i, 128, 1.5);
    const pTex = new THREE.CanvasTexture(canvasP);

    const canvasS = document.createElement('canvas');
    canvasS.width = 256; canvasS.height = 1024;
    const ctxS = canvasS.getContext('2d');
    ctxS.fillStyle = '#111a2d'; ctxS.fillRect(0,0,256,512);
    ctxS.fillStyle = '#c35936'; ctxS.fillRect(0,512,256,512);
    ctxS.fillStyle = '#dfb256'; ctxS.font = 'bold 36px sans-serif'; ctxS.textAlign = 'center';
    
    ctxS.save(); ctxS.translate(128, 256); ctxS.rotate(Math.PI/2);
    ctxS.fillText("▲ SOMMET · 9 ÉTAGES", 0, 12); ctxS.restore();

    ctxS.save(); ctxS.translate(128, 768); ctxS.rotate(-Math.PI/2);
    ctxS.fillStyle = '#f7eedb'; ctxS.fillText("▲ TERRAIN · 9 ÉTAGES", 0, 12); ctxS.restore();
    const spineTex = new THREE.CanvasTexture(canvasS);

    const materials = [
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: spineTex }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: tCover, roughness: 0.35 }),
        new THREE.MeshStandardMaterial({ map: sCover, roughness: 0.35 })
    ];

    bookMesh = new THREE.Mesh(geometry, materials);
    bookMesh.rotation.set(0.15, -0.35, 0);
    scene.add(bookMesh);

    // FREE TOUCH TRACKBALL (360° SANS BLOCAGE)
    const dom = renderer.domElement;
    dom.addEventListener('touchstart', (e) => {
        isTouchDragging = true;
        prevTouchPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });

    dom.addEventListener('touchmove', (e) => {
        if (!isTouchDragging) return;
        const deltaX = e.touches[0].clientX - prevTouchPos.x;
        const deltaY = e.touches[0].clientY - prevTouchPos.y;

        const deltaQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(
            deltaY * 0.01,
            deltaX * 0.01,
            0,
            'XYZ'
        ));
        bookMesh.quaternion.multiplyQuaternions(deltaQuat, bookMesh.quaternion);
        prevTouchPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });

    dom.addEventListener('touchend', () => { isTouchDragging = false; });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate3DLoop();
    initAppCore();
}

function animate3DLoop(time) {
    requestAnimationFrame(animate3DLoop);
    TWEEN.update(time);
    if (!isFlipping3D && bookMesh && !isReading) {
        bookMesh.position.y = Math.sin(time * 0.0015) * 0.08;
    }
    renderer.render(scene, camera);
}

async function initAppCore() {
    loadUserStore();
    docTerrain = await pdfjsLib.getDocument('terrain.pdf').promise;
    docSommet = await pdfjsLib.getDocument('sommet.pdf').promise;
    updateSideBadge();
    applyTheme(userStore.theme || 'theme-dark');
    document.getElementById('font-sz-display').innerText = `${currentFontSize}px`;
    setupTouchGestures();
}

function renderActiveView() {
    const pLabel = (currentPage === 1) ? "Couverture" : `p. ${currentPage - 1} / 167`;
    document.getElementById('page-scrubber').value = currentPage;
    document.getElementById('page-indicator-txt').innerText = pLabel;

    if (isPdfMode) {
        document.getElementById('live-reader-body').style.display = 'none';
        document.getElementById('pdf-facsimile-wrapper').style.display = 'flex';
        document.getElementById('reader-quick-toolbar').style.display = 'none';
        renderPdfPage();
    } else {
        document.getElementById('live-reader-body').style.display = 'block';
        document.getElementById('pdf-facsimile-wrapper').style.display = 'none';
        document.getElementById('reader-quick-toolbar').style.display = 'flex';
        renderReflowPage();
    }

    saveUserStore();
}

// 1. LIVE REFLOW DYNAMIQUE (9:16 PLEIN ÉCRAN FLUIDE)
function renderReflowPage() {
    const rawList = (currentSide === 'terrain') ? window.BOOK_CONTENT.terrain : window.BOOK_CONTENT.sommet;
    const pageItem = rawList[currentPage - 1];

    const zone = document.getElementById('reflow-text-zone');
    const headerTag = document.getElementById('reflow-header-tag');

    const sideName = (currentSide === 'terrain') ? 'CÔTÉ TERRAIN' : 'CÔTÉ SOMMET';
    const pName = (currentPage === 1) ? 'COUVERTURE' : `PAGE ${currentPage - 1}`;
    headerTag.innerText = `${sideName} · ${pName}`;

    if (!pageItem || !pageItem.text) {
        zone.innerHTML = `<div style="text-align:center; padding:40px 10px; color:#888;">(Illustration ou page graphique originale)<br><br><button onclick="toggleViewMode()" style="background:#dfb256; color:#111; font-weight:800; padding:8px 16px; border:none; border-radius:15px; cursor:pointer;">Voir en mode PDF exact ➔</button></div>`;
    } else {
        // Render formatted paragraphs with proper typography
        const paragraphs = pageItem.text.split("\n\n").filter(p => p.trim());
        let htmlContent = "";
        paragraphs.forEach(p => {
            htmlContent += `<p class="reflow-para" style="font-size: ${currentFontSize}px;">${p.replace(/\n/g, ' ')}</p>`;
        });
        zone.innerHTML = htmlContent;
    }

    document.getElementById('live-reader-body').scrollTop = 0;
}

// 2. MODE PDF EXACT (FAC-SIMILÉ)
async function renderPdfPage() {
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    if (!activeDoc) return;

    const page = await activeDoc.getPage(currentPage);
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    
    const viewport = page.getViewport({ scale: 2.2 });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
}

function nextStep() {
    const maxP = 168;
    if (currentPage < maxP) {
        currentPage++;
        renderActiveView();
    }
}

function prevStep() {
    if (currentPage > 1) {
        currentPage--;
        renderActiveView();
    }
}

function onScrubPage(val) {
    currentPage = parseInt(val);
    renderActiveView();
}

function flip3DTeteBeche() {
    if (isFlipping3D) return;
    isFlipping3D = true;

    currentSide = (currentSide === 'terrain') ? 'sommet' : 'terrain';
    currentPage = (currentSide === 'terrain') ? (userStore.terrainLastPage || 1) : (userStore.sommetLastPage || 1);

    const targetY = (currentSide === 'sommet') ? Math.PI - 0.35 : -0.35;
    const targetZ = (currentSide === 'sommet') ? Math.PI : 0;

    new TWEEN.Tween(bookMesh.rotation)
        .to({ y: targetY, z: targetZ, x: 0.15 }, 1200)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onComplete(() => { isFlipping3D = false; })
        .start();

    updateSideBadge();
    if (isReading) renderActiveView();
}

function updateSideBadge() {
    const b = document.getElementById('badge-side');
    if (currentSide === 'terrain') {
        b.className = "side-pill pill-terrain";
        b.innerText = "TERRAIN";
    } else {
        b.className = "side-pill pill-sommet";
        b.innerText = "SOMMET";
    }
}

function changeFontSize(delta) {
    currentFontSize = Math.max(13, Math.min(28, currentFontSize + delta));
    document.getElementById('font-sz-display').innerText = `${currentFontSize}px`;
    userStore.fontSize = currentFontSize;
    renderReflowPage();
}

function applyTheme(themeName) {
    const el = document.getElementById('live-reader-container');
    el.className = themeName;
    userStore.theme = themeName;
}

function toggleViewMode() {
    isPdfMode = !isPdfMode;
    const btn = document.getElementById('btn-view-mode');
    btn.innerText = isPdfMode ? "📄 PDF Exact" : "Aa Texte";
    btn.style.background = isPdfMode ? "#dfb256" : "rgba(255,255,255,0.08)";
    btn.style.color = isPdfMode ? "#111" : "#dfb256";
    if (isReading) renderActiveView();
}

function openReader() {
    isReading = true;
    document.getElementById('live-reader-container').style.display = 'flex';
    document.getElementById('home-3d-cta').style.display = 'none';
    renderActiveView();
}

function closeReader() {
    isReading = false;
    document.getElementById('live-reader-container').style.display = 'none';
    document.getElementById('home-3d-cta').style.display = 'flex';
}

function toggleCurrentBookmark() {
    const list = (currentSide === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const idx = list.indexOf(currentPage);
    const pLabel = (currentPage === 1) ? "Couverture" : `Page ${currentPage - 1}`;
    if (idx === -1) {
        list.push(currentPage);
        list.sort((a,b) => a - b);
        showToastAlert(`🔖 ${pLabel} mémorisée !`);
    } else {
        list.splice(idx, 1);
        showToastAlert(`Marque-page retiré`);
    }
    saveUserStore();
}

function updateBookmarkUI() {
    const list = (currentSide === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const isBm = list.includes(currentPage);
    
    const btn = document.getElementById('btn-save-bm');
    const label = document.getElementById('txt-bm-label');
    if (isBm) {
        btn.classList.add('active-bm');
        label.innerText = "Mémorisée ★";
    } else {
        btn.classList.remove('active-bm');
        label.innerText = "Marquer";
    }

    const total = (userStore.terrainBookmarks || []).length + (userStore.sommetBookmarks || []).length;
    document.getElementById('txt-bm-total').innerText = `Pages (${total})`;
}

function openBookmarksList() {
    const c = document.getElementById('dialog-bm-items');
    c.innerHTML = '';
    
    const all = [];
    (userStore.terrainBookmarks || []).forEach(p => all.push({ side: 'terrain', page: p }));
    (userStore.sommetBookmarks || []).forEach(p => all.push({ side: 'sommet', page: p }));

    if (all.length === 0) {
        c.innerHTML = '<div style="font-size:12px; color:#888; text-align:center; padding:15px;">Aucun marque-page enregistré.</div>';
    } else {
        all.forEach(item => {
            const row = document.createElement('div');
            row.className = 'dialog-item';
            const badgeBg = (item.side === 'terrain') ? '#c35936' : '#133968';
            const pTxt = (item.page === 1) ? "Couverture" : `Page ${item.page - 1}`;
            row.innerHTML = `
                <div onclick="jumpToBm('${item.side}', ${item.page})" style="display:flex; align-items:center; gap:8px; flex:1;">
                    <span style="background:${badgeBg}; color:#fff; font-size:9px; font-weight:800; padding:2px 6px; border-radius:8px; text-transform:uppercase;">${item.side}</span>
                    <span style="font-size:13px; font-weight:700; color:#f7eedb;">${pTxt}</span>
                </div>
                <button onclick="delBmItem('${item.side}', ${item.page}, event)" style="background:transparent; border:none; color:#e74c3c; font-size:14px; cursor:pointer;">🗑️</button>
            `;
            c.appendChild(row);
        });
    }

    document.getElementById('bookmarks-dialog-overlay').style.display = 'flex';
}

function closeBookmarksList() {
    document.getElementById('bookmarks-dialog-overlay').style.display = 'none';
}

function jumpToBm(side, pageNum) {
    closeBookmarksList();
    currentSide = side;
    currentPage = pageNum;
    updateSideBadge();
    if (!isReading) openReader();
    else renderActiveView();
}

function delBmItem(side, pageNum, event) {
    event.stopPropagation();
    const list = (side === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const idx = list.indexOf(pageNum);
    if (idx !== -1) {
        list.splice(idx, 1);
        saveUserStore();
        openBookmarksList();
    }
}

function showToastAlert(txt) {
    const t = document.getElementById('toast-box');
    t.innerText = txt; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2200);
}

function setupTouchGestures() {
    let tStartX = 0, tEndX = 0;
    const reader = document.getElementById('live-reader-container');
    reader.addEventListener('touchstart', (e) => {
        tStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    reader.addEventListener('touchend', (e) => {
        tEndX = e.changedTouches[0].screenX;
        const diff = tEndX - tStartX;
        if (diff < -50) nextStep();
        if (diff > 50) prevStep();
    }, { passive: true });
}

window.onload = init3DStage;
</script>
</body>
</html>
