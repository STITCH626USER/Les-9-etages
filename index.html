<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #040711; font-family: 'Plus Jakarta Sans', sans-serif;
    color: #f7eedb; user-select: none; -webkit-tap-highlight-color: transparent;
}

/* =================================================== */
/* TOP HEADER TRÈS GRAND & LISIBLE (HAUTEUR 76px) */
/* =================================================== */
#m-header {
    height: 76px; width: 100%; background: #0c1220;
    border-bottom: 2px solid rgba(255,255,255,0.18);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 16px; position: fixed; top: 0; left: 0; z-index: 500;
}
.brand-zone { display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.title-row { display: flex; align-items: center; gap: 8px; }
.title-txt {
    font-family: 'Cinzel', serif; font-size: 18px; font-weight: 900;
    letter-spacing: 1px; color: #f7eedb;
}
.author-txt {
    font-size: 12px; font-weight: 700; color: #dfb256; letter-spacing: 0.5px;
}
.side-pill {
    padding: 5px 12px; border-radius: 14px; font-size: 11px; font-weight: 900;
    text-transform: uppercase;
}
.pill-terrain { background: #c35936; color: #fff; box-shadow: 0 0 12px rgba(195,89,54,0.6); }
.pill-sommet { background: #133968; color: #dfb256; box-shadow: 0 0 12px rgba(223,178,86,0.6); }

.header-btns { display: flex; align-items: center; gap: 10px; }
.btn-h {
    background: #182236; border: 2px solid rgba(255,255,255,0.3);
    color: #f7eedb; padding: 12px 18px; border-radius: 24px; font-size: 15px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; gap: 6px; min-height: 48px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.btn-h.active-bm { background: #dfb256; color: #111; font-weight: 900; border-color: #dfb256; }
.btn-flip-act {
    background: linear-gradient(135deg, #c35936 0%, #dfb256 100%);
    color: #111; font-weight: 900; font-size: 15px; border: none;
    padding: 12px 20px; border-radius: 24px; cursor: pointer; min-height: 48px;
    box-shadow: 0 4px 18px rgba(223, 178, 86, 0.6); white-space: nowrap;
}

/* =================================================== */
/* 3D STAGE BOX (PLEIN ÉCRAN & GARANTI VISIBLE) */
/* =================================================== */
#stage-3d-box {
    width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 10;
    touch-action: none; background: radial-gradient(circle at center, #10192e 0%, #040711 85%);
}

#home-3d-cta {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    width: 92%; max-width: 380px; z-index: 50; text-align: center;
    display: flex; flex-direction: column; gap: 12px;
}
.cta-info-bubble {
    font-size: 13px; font-weight: 700; color: #889bb8;
    background: rgba(12,18,32,0.92); padding: 9px 18px; border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.2);
}
.cta-btn-main {
    background: #dfb256; color: #111; font-size: 18px; font-weight: 900;
    padding: 18px 36px; border-radius: 36px; border: none; cursor: pointer;
    box-shadow: 0 10px 30px rgba(223, 178, 86, 0.6); width: 100%;
}

/* =================================================== */
/* LISEUSE HAUTE FIDÉLITÉ (SANS FLÈCHES LATÉRALES) */
/* =================================================== */
#live-reader-container {
    position: fixed; top: 76px; left: 0; width: 100vw; height: calc(100vh - 76px);
    display: none; justify-content: center; align-items: center;
    background: #040711; z-index: 90; overflow: hidden;
}

#reader-scroll-viewport {
    width: 100%; height: 100%;
    overflow-y: auto; overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    display: flex; justify-content: center; align-items: center;
    padding: 95px 12px 115px 12px;
}

#spread-card-wrapper {
    background: #ffffff; border-radius: 6px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.95);
    position: relative; margin: auto;
    flex-shrink: 0;
}
.canvas-page-single { display: block; width: 100%; height: auto; border-radius: 6px; }


/* ZOOM TOOLBAR GÉANTE (HAUTEUR 56px) */
#reader-zoom-bar {
    position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
    background: #0e1628;
    border: 2px solid rgba(255,255,255,0.3); border-radius: 40px;
    padding: 8px 24px; display: flex; align-items: center; gap: 16px;
    z-index: 120; font-size: 16px; font-weight: 800;
    box-shadow: 0 12px 35px rgba(0,0,0,0.9);
    opacity: 0.20; transition: opacity 0.4s ease;
}
#reader-zoom-bar:hover, #reader-zoom-bar.dock-awake { opacity: 1 !important; }

.btn-zoom-step {
    background: #1b263e; border: 2px solid rgba(255,255,255,0.35);
    color: #dfb256; width: 48px; height: 48px; border-radius: 14px; font-size: 24px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
}
#zoom-percentage-txt { color: #dfb256; font-size: 17px; font-weight: 900; min-width: 58px; text-align: center; }
.btn-mode-pill {
    background: #1b263e; border: 2px solid rgba(255,255,255,0.3);
    color: #f7eedb; font-size: 14px; font-weight: 800; padding: 10px 18px; border-radius: 20px;
    cursor: pointer; min-height: 44px; display: flex; align-items: center;
}

/* BOTTOM DOCK GÉANT (HAUTEUR 72px) - AUCUN BOUTON SUR LES CÔTÉS */
#m-bottom-dock {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 94%; max-width: 500px; height: 72px;
    background: #0c1220;
    border: 2px solid rgba(255,255,255,0.3); border-radius: 40px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; z-index: 150;
    box-shadow: 0 16px 45px rgba(0,0,0,0.95);
    opacity: 0.20; transition: opacity 0.4s ease;
}
#m-bottom-dock:hover, #m-bottom-dock.dock-awake { opacity: 1 !important; }

.dock-nav-btn {
    background: #1b263e; border: 2px solid rgba(255,255,255,0.35);
    color: #f7eedb; padding: 12px 22px; border-radius: 22px; font-size: 20px; font-weight: 900;
    cursor: pointer; min-width: 64px; min-height: 52px; display: flex; align-items: center; justify-content: center;
}
.dock-slider-bar {
    flex: 1; margin: 0 18px; -webkit-appearance: none; appearance: none;
    height: 10px; border-radius: 10px; background: rgba(255,255,255,0.3); outline: none;
}
.dock-slider-bar::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 32px; height: 32px;
    border-radius: 50%; background: #dfb256; cursor: pointer;
    box-shadow: 0 0 16px rgba(223, 178, 86, 1);
}
#page-indicator-txt { font-size: 16px; font-weight: 900; color: #dfb256; min-width: 120px; text-align: center; }

/* MODAL MARQUE-PAGES */
#bookmarks-dialog-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(4, 6, 12, 0.88); backdrop-filter: blur(25px);
    display: none; justify-content: center; align-items: center; z-index: 600;
    padding: 20px;
}
.dialog-box {
    background: #101728; border: 2px solid rgba(255,255,255,0.25);
    border-radius: 24px; padding: 28px 22px; width: 100%; max-width: 360px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.95); text-align: center;
}
.dialog-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin: 18px 0; text-align: left; }
.dialog-item {
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.18);
    padding: 12px 16px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
}

#toast-box {
    position: fixed; top: 88px; left: 50%; transform: translateX(-50%);
    background: #dfb256; color: #111; font-weight: 900; font-size: 14px;
    padding: 10px 24px; border-radius: 25px; display: none; z-index: 700;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}
</style>
</head>
<body>

<div id="toast-box">Page mémorisée !</div>

<!-- TOP HEADER -->
<div id="m-header">
    <div class="brand-zone">
        <div class="title-row">
            <span class="title-txt">9 ÉTAGES</span>
            <span id="badge-side" class="side-pill pill-terrain">TERRAIN</span>
        </div>
        <span class="author-txt">Alexandre R.</span>
    </div>

    <div class="header-btns">
        <button id="btn-save-bm" class="btn-h" onclick="toggleCurrentBookmark()">🔖 <span id="txt-bm-label">Marquer</span></button>
        <button class="btn-h" onclick="openBookmarksList()">📂 <span id="txt-bm-total">Pages (0)</span></button>
        <button class="btn-flip-act" onclick="flip3DTeteBeche()">🔄 RETOURNER</button>
    </div>
</div>

<!-- 3D STAGE BOX -->
<div id="stage-3d-box"></div>

<!-- 3D HOME CTA (OUVRIR LE LIVRE) -->
<div id="home-3d-cta">
    <div class="cta-info-bubble">
        👆 Touchez & glissez pour manipuler à 360°
    </div>
    <button class="cta-btn-main" onclick="openReader()">
        OUVRIR LE LIVRE ➔
    </button>
</div>

<!-- LISEUSE PLEIN ÉCRAN -->
<div id="live-reader-container">
    
    <!-- ZOOM TOOLBAR GÉANTE -->
    <div id="reader-zoom-bar">
        <span>Zoom :</span>
        <button class="btn-zoom-step" onclick="stepZoom(-0.15)">−</button>
        <span id="zoom-percentage-txt">100%</span>
        <button class="btn-zoom-step" onclick="stepZoom(0.15)">+</button>
        <button class="btn-mode-pill" onclick="resetZoomDefault()">1:1 Centré</button>
    </div>

    <div id="reader-scroll-viewport">
        <div id="spread-card-wrapper">
            <canvas id="page-canvas-single" class="canvas-page-single"></canvas>
        </div>
    </div>

    <!-- BOTTOM DOCK GÉANT -->
    <div id="m-bottom-dock">
        <button class="dock-nav-btn" onclick="prevStep()">◀</button>
        <input type="range" id="page-scrubber" class="dock-slider-bar" min="1" max="168" value="1" oninput="onScrubPage(this.value)" />
        <span id="page-indicator-txt">Couverture</span>
        <button class="dock-nav-btn" onclick="nextStep()">▶</button>
    </div>
</div>

<!-- BOOKMARKS MODAL -->
<div id="bookmarks-dialog-overlay">
    <div class="dialog-box">
        <div style="font-size:36px; margin-bottom:8px;">🔖</div>
        <h3 style="font-size:19px; color:#dfb256; text-transform:uppercase;">Mes Marque-Pages</h3>
        <p style="font-size:13px; color:#889bb8; margin-bottom:16px;">Accédez instantanément à vos pages</p>
        <div class="dialog-list" id="dialog-bm-items"></div>
        <button onclick="closeBookmarksList()" style="background:#dfb256; color:#111; font-weight:900; font-size:15px; padding:12px 28px; border-radius:25px; border:none; cursor:pointer; width:100%;">Fermer ✕</button>
    </div>
</div>

<script>
const STORAGE_KEY = "LES_9_ETAGES_APP_STORAGE_MASTER_V2";

let currentSide = 'terrain'; // 'terrain' or 'sommet'
let currentPage = 1; // 1 to 168
let isReading = false;
let zoomFactor = 1.0;

let docTerrain = null;
let docSommet = null;

// Three.js
let scene, camera, renderer, bookMesh;
let isFlipping3D = false;
let isTouchDragging = false;
let prevTouchPos = { x: 0, y: 0 };
let renderTaskSingle = null;
let dockFadeTimeout = null;

let userStore = {
    terrainLastPage: 1,
    sommetLastPage: 1,
    terrainBookmarks: [],
    sommetBookmarks: [],
    lastSide: 'terrain'
};

function loadUserStore() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            userStore = JSON.parse(saved);
            currentSide = userStore.lastSide || 'terrain';
            currentPage = (currentSide === 'terrain') ? (userStore.terrainLastPage || 1) : (userStore.sommetLastPage || 1);
        } catch(e) {}
    } else {
        currentSide = 'terrain';
        currentPage = 1;
    }
    updateBookmarkUI();
}

function saveUserStore() {
    if (currentSide === 'terrain') userStore.terrainLastPage = currentPage;
    else userStore.sommetLastPage = currentPage;
    userStore.lastSide = currentSide;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(userStore));
    updateBookmarkUI();
}

function init3DStage() {
    const container = document.getElementById('stage-3d-box');
    if (!container) return;
    container.innerHTML = '';

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 9.2);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.1));
    const lKey = new THREE.DirectionalLight(0xffffff, 1.0);
    lKey.position.set(5, 8, 7); scene.add(lKey);
    const lRim = new THREE.DirectionalLight(0xdfb256, 0.7);
    lRim.position.set(-5, -4, 5); scene.add(lRim);

    const geometry = new THREE.BoxGeometry(3.2, 4.5, 0.52);
    const loader = new THREE.TextureLoader();
    const tCover = loader.load(window.BOOK_DATA.terrainCover, () => { if (renderer && scene && camera) renderer.render(scene, camera); });
    const sCover = loader.load(window.BOOK_DATA.sommetCover, () => { if (renderer && scene && camera) renderer.render(scene, camera); });
    sCover.center.set(0.5, 0.5);
    sCover.rotation = Math.PI;

    const canvasP = document.createElement('canvas');
    canvasP.width = 128; canvasP.height = 512;
    const ctxP = canvasP.getContext('2d');
    ctxP.fillStyle = '#f6f0df'; ctxP.fillRect(0,0,128,512);
    ctxP.fillStyle = '#d8cca8';
    for(let i=0; i<512; i+=4) ctxP.fillRect(0, i, 128, 1.5);
    const pTex = new THREE.CanvasTexture(canvasP);

    const canvasS = document.createElement('canvas');
    canvasS.width = 256; canvasS.height = 1024;
    const ctxS = canvasS.getContext('2d');
    ctxS.fillStyle = '#111a2d'; ctxS.fillRect(0,0,256,512);
    ctxS.fillStyle = '#c35936'; ctxS.fillRect(0,512,256,512);
    ctxS.fillStyle = '#dfb256'; ctxS.font = 'bold 36px sans-serif'; ctxS.textAlign = 'center';
    
    ctxS.save(); ctxS.translate(128, 256); ctxS.rotate(Math.PI/2);
    ctxS.fillText("▲ SOMMET · 9 ÉTAGES", 0, 12); ctxS.restore();

    ctxS.save(); ctxS.translate(128, 768); ctxS.rotate(-Math.PI/2);
    ctxS.fillStyle = '#f7eedb'; ctxS.fillText("▲ TERRAIN · 9 ÉTAGES", 0, 12); ctxS.restore();
    const spineTex = new THREE.CanvasTexture(canvasS);

    const materials = [
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: spineTex }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: tCover, roughness: 0.35 }),
        new THREE.MeshStandardMaterial({ map: sCover, roughness: 0.35 })
    ];

    bookMesh = new THREE.Mesh(geometry, materials);
    if (currentSide === 'sommet') {
        bookMesh.rotation.set(0.15, Math.PI - 0.35, Math.PI);
    } else {
        bookMesh.rotation.set(0.15, -0.35, 0);
    }
    scene.add(bookMesh);

    // FREE TOUCH TRACKBALL (360° SANS BLOCAGE)
    const dom = renderer.domElement;
    dom.addEventListener('pointerdown', (e) => {
        isTouchDragging = true;
        prevTouchPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
        if (!isTouchDragging || !bookMesh) return;
        const deltaX = e.clientX - prevTouchPos.x;
        const deltaY = e.clientY - prevTouchPos.y;

        const deltaQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(
            deltaY * 0.008,
            deltaX * 0.008,
            0,
            'XYZ'
        ));
        bookMesh.quaternion.multiplyQuaternions(deltaQuat, bookMesh.quaternion);
        prevTouchPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => { isTouchDragging = false; });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (isReading) renderUniversalReader();
    });

    animate3DLoop();
    initAppCore();
}

function animate3DLoop(time) {
    requestAnimationFrame(animate3DLoop);
    if (typeof TWEEN !== 'undefined') TWEEN.update(time);
    if (!isFlipping3D && bookMesh && !isReading && !isTouchDragging) {
        bookMesh.position.y = Math.sin(time * 0.0015) * 0.08;
    }
    if (renderer && scene && camera) {
        renderer.render(scene, camera);
    }
}

async function initAppCore() {
    loadUserStore();
    updateSideBadge();
    updateBookmarkUI();
    docTerrain = await pdfjsLib.getDocument('terrain.pdf').promise;
    docSommet = await pdfjsLib.getDocument('sommet.pdf').promise;
    updateSideBadge();
    updateBookmarkUI();
    initDockFadeListeners();
}

function wakeBottomDock() {
    const dock = document.getElementById('m-bottom-dock');
    const zoom = document.getElementById('reader-zoom-bar');
    if (dock) dock.classList.add('dock-awake');
    if (zoom) zoom.classList.add('dock-awake');
    
    clearTimeout(dockFadeTimeout);
    dockFadeTimeout = setTimeout(() => {
        if (dock) dock.classList.remove('dock-awake');
        if (zoom) zoom.classList.remove('dock-awake');
    }, 2800);
}

function initDockFadeListeners() {
    window.addEventListener('touchstart', wakeBottomDock, { passive: true });
    window.addEventListener('touchmove', wakeBottomDock, { passive: true });
    window.addEventListener('mousemove', wakeBottomDock);
    window.addEventListener('scroll', wakeBottomDock, { passive: true });
    wakeBottomDock();
}

async function renderUniversalReader() {
    if (renderTaskSingle) { try { renderTaskSingle.cancel(); } catch(e){} renderTaskSingle = null; }
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    if (!activeDoc) return;

    const pLabel = (currentPage === 1) ? "Couverture" : `p. ${currentPage - 1} / 167`;
    
    document.getElementById('page-scrubber').value = currentPage;
    document.getElementById('page-indicator-txt').innerText = pLabel;
    document.getElementById('zoom-percentage-txt').innerText = `${Math.round(zoomFactor * 100)}%`;

    const wrapper = document.getElementById('spread-card-wrapper');
    const cSingle = document.getElementById('page-canvas-single');

    const screenW = window.innerWidth;
    const availH = window.innerHeight - 76 - 72;

    const page = await activeDoc.getPage(currentPage);
    
    const maxH = (availH * 0.94) * zoomFactor;
    const maxW = (screenW * 0.92) * zoomFactor;

    let targetSingleW = maxW;
    let targetSingleH = targetSingleW * (210 / 148);

    if (targetSingleH > maxH && zoomFactor <= 1.0) {
        targetSingleH = maxH;
        targetSingleW = targetSingleH * (148 / 210);
    }

    const scale = (targetSingleW / (page.view[2] - page.view[0])) * 2.2;
    const vp = page.getViewport({ scale: scale });

    cSingle.width = vp.width; cSingle.height = vp.height;
    renderTaskSingle = page.render({ canvasContext: cSingle.getContext('2d'), viewport: vp });
    try { await renderTaskSingle.promise; } catch(e){}

    wrapper.style.width = targetSingleW + 'px';
    wrapper.style.height = targetSingleH + 'px';
    cSingle.style.width = targetSingleW + 'px';
    cSingle.style.height = targetSingleH + 'px';

    saveUserStore();
}




function stepZoom(delta) {
    wakeBottomDock();
    zoomFactor = Math.max(0.70, Math.min(1.30, +(zoomFactor + delta).toFixed(2)));
    renderUniversalReader();
}

function resetZoomDefault() {
    wakeBottomDock();
    zoomFactor = 1.0;
    renderUniversalReader();
    document.getElementById('reader-scroll-viewport').scrollTop = 0;
    document.getElementById('reader-scroll-viewport').scrollLeft = 0;
}

function nextStep() {
    wakeBottomDock();
    if (currentPage < 168) {
        currentPage += 1;
        renderUniversalReader();
    }
}

function prevStep() {
    wakeBottomDock();
    if (currentPage > 1) {
        currentPage -= 1;
        renderUniversalReader();
    }
}

function onScrubPage(val) {
    currentPage = parseInt(val);
    renderUniversalReader();
    wakeBottomDock();
}

function flip3DTeteBeche() {
    if (isFlipping3D) return;
    isFlipping3D = true;

    currentSide = (currentSide === 'terrain') ? 'sommet' : 'terrain';
    currentPage = (currentSide === 'terrain') ? (userStore.terrainLastPage || 1) : (userStore.sommetLastPage || 1);

    const targetY = (currentSide === 'sommet') ? Math.PI - 0.35 : -0.35;
    const targetZ = (currentSide === 'sommet') ? Math.PI : 0;

    new TWEEN.Tween(bookMesh.rotation)
        .to({ y: targetY, z: targetZ, x: 0.15 }, 1200)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onComplete(() => { isFlipping3D = false; })
        .start();

    updateSideBadge();
    if (isReading) renderUniversalReader();
}

function updateSideBadge() {
    const b = document.getElementById('badge-side');
    if (currentSide === 'terrain') {
        b.className = "side-pill pill-terrain";
        b.innerText = "TERRAIN";
    } else {
        b.className = "side-pill pill-sommet";
        b.innerText = "SOMMET";
    }
}

function openReader() {
    isReading = true;
    document.getElementById('live-reader-container').style.display = 'flex';
    document.getElementById('home-3d-cta').style.display = 'none';
    renderUniversalReader();
}

function toggleCurrentBookmark() {
    const list = (currentSide === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const idx = list.indexOf(currentPage);
    const pLabel = (currentPage === 1) ? "Couverture" : `Page ${currentPage - 1}`;
    if (idx === -1) {
        list.push(currentPage);
        list.sort((a,b) => a - b);
        showToastAlert(`🔖 ${pLabel} mémorisée !`);
    } else {
        list.splice(idx, 1);
        showToastAlert(`Marque-page retiré`);
    }
    saveUserStore();
}

function updateBookmarkUI() {
    const list = (currentSide === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const isBm = list.includes(currentPage);
    
    const btn = document.getElementById('btn-save-bm');
    const label = document.getElementById('txt-bm-label');
    if (isBm) {
        btn.classList.add('active-bm');
        label.innerText = "Mémorisée ★";
    } else {
        btn.classList.remove('active-bm');
        label.innerText = "Marquer";
    }

    const total = (userStore.terrainBookmarks || []).length + (userStore.sommetBookmarks || []).length;
    document.getElementById('txt-bm-total').innerText = `Pages (${total})`;
}

function openBookmarksList() {
    const c = document.getElementById('dialog-bm-items');
    c.innerHTML = '';
    
    const all = [];
    (userStore.terrainBookmarks || []).forEach(p => all.push({ side: 'terrain', page: p }));
    (userStore.sommetBookmarks || []).forEach(p => all.push({ side: 'sommet', page: p }));

    if (all.length === 0) {
        c.innerHTML = '<div style="font-size:14px; color:#888; text-align:center; padding:15px;">Aucun marque-page enregistré.</div>';
    } else {
        all.forEach(item => {
            const row = document.createElement('div');
            row.className = 'dialog-item';
            const badgeBg = (item.side === 'terrain') ? '#c35936' : '#133968';
            const pTxt = (item.page === 1) ? "Couverture" : `Page ${item.page - 1}`;
            row.innerHTML = `
                <div onclick="jumpToBm('${item.side}', ${item.page})" style="display:flex; align-items:center; gap:10px; flex:1;">
                    <span style="background:${badgeBg}; color:#fff; font-size:11px; font-weight:900; padding:4px 8px; border-radius:10px; text-transform:uppercase;">${item.side}</span>
                    <span style="font-size:15px; font-weight:800; color:#f7eedb;">${pTxt}</span>
                </div>
                <button onclick="delBmItem('${item.side}', ${item.page}, event)" style="background:transparent; border:none; color:#e74c3c; font-size:18px; cursor:pointer;">🗑️</button>
            `;
            c.appendChild(row);
        });
    }

    document.getElementById('bookmarks-dialog-overlay').style.display = 'flex';
}

function closeBookmarksList() {
    document.getElementById('bookmarks-dialog-overlay').style.display = 'none';
}

function jumpToBm(side, pageNum) {
    closeBookmarksList();
    currentSide = side;
    currentPage = pageNum;
    updateSideBadge();
    if (!isReading) openReader();
    else renderUniversalReader();
}

function delBmItem(side, pageNum, event) {
    event.stopPropagation();
    const list = (side === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const idx = list.indexOf(pageNum);
    if (idx !== -1) {
        list.splice(idx, 1);
        saveUserStore();
        openBookmarksList();
    }
}

function showToastAlert(txt) {
    const t = document.getElementById('toast-box');
    t.innerText = txt; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2200);
}

window.onload = () => {
    init3DStage();
};
</script>
</body>
</html>
