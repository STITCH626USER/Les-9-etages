<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LES 9 ÉTAGES — Alexandre R.</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<meta name="title" content="LES 9 ÉTAGES — Alexandre R.">
<meta name="description" content="Découvrez le livre tête-bêche « Les 9 Étages » par Alexandre R.">

<!-- Three.js & TWEEN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

<!-- PDF.js Mozilla -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>

<script src="book_data.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #040711; font-family: 'Plus Jakarta Sans', sans-serif;
    color: #f7eedb; user-select: none; -webkit-tap-highlight-color: transparent;
}

/* =================================================== */
/* 📱 HEADER SUPÉRIEUR HAUTE FIDÉLITÉ */
/* =================================================== */
#m-header {
    height: 56px; width: 100%; background: #0c1220;
    border-bottom: 1px solid rgba(255,255,255,0.14);
    display: flex; align-items: center; justify-content: flex-start;
    padding: 0 12px; position: fixed; top: 0; left: 0; z-index: 500;
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    touch-action: pan-x;
}
#m-header::-webkit-scrollbar { display: none; }

.header-inner-track {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; min-width: max-content; gap: 12px; flex-shrink: 0;
}

.brand-zone {
    display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
    cursor: pointer; user-select: none;
    transition: transform 0.2s ease, opacity 0.2s ease;
}
.brand-zone:hover { opacity: 0.9; transform: scale(1.02); }
.brand-zone:active { transform: scale(0.97); }
.title-txt {
    font-family: 'Cinzel', serif; font-size: 15px; font-weight: 900;
    letter-spacing: 0.5px; color: #f7eedb; white-space: nowrap;
}
.author-txt {
    font-size: 11px; font-weight: 700; color: #dfb256; letter-spacing: 0.3px; white-space: nowrap;
}
.side-pill {
    padding: 3px 8px; border-radius: 8px; font-size: 9px; font-weight: 900;
    text-transform: uppercase; white-space: nowrap;
}
.pill-terrain { background: #c35936; color: #fff; }
.pill-sommet { background: #133968; color: #dfb256; }

.header-btns { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn-h {
    background: #182236; border: 1.5px solid rgba(255,255,255,0.22);
    color: #f7eedb; padding: 7px 12px; border-radius: 14px; font-size: 12px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; gap: 5px; min-height: 36px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4); white-space: nowrap; flex-shrink: 0;
}
.btn-h.active-bm { background: #dfb256; color: #111; font-weight: 900; border-color: #dfb256; }
.btn-flip-act {
    background: linear-gradient(135deg, #c35936 0%, #dfb256 100%);
    color: #111; font-weight: 900; font-size: 12px; border: none;
    padding: 8px 14px; border-radius: 14px; cursor: pointer; min-height: 36px;
    box-shadow: 0 3px 12px rgba(223, 178, 86, 0.4); white-space: nowrap; flex-shrink: 0;
}

/* =================================================== */
/* 🧊 SCÈNE 3D DE L'ACCUEIL */
/* =================================================== */
#stage-3d-box {
    width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 10;
    touch-action: none; background: radial-gradient(circle at center, #10192e 0%, #040711 85%);
}

#home-3d-cta {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 360px; z-index: 100; text-align: center;
    display: flex; flex-direction: column; gap: 12px;
}
.cta-info-bubble {
    font-size: 12px; font-weight: 700; color: #9ab0d0;
    background: rgba(12,18,32,0.92); padding: 9px 18px; border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px);
}
.cta-btn-main {
    background: #dfb256; color: #111; font-size: 16px; font-weight: 900;
    padding: 16px 32px; border-radius: 32px; border: none; cursor: pointer;
    box-shadow: 0 8px 25px rgba(223, 178, 86, 0.6); width: 100%;
}

/* =================================================== */
/* 📖 LISEUSE NUMÉRIQUE */
/* =================================================== */
#live-reader-container {
    position: fixed; top: 56px; left: 0; width: 100vw; height: calc(100vh - 56px);
    display: none; justify-content: center; align-items: center;
    background: #040711; z-index: 90; overflow: hidden;
}

#reader-scroll-viewport {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    box-sizing: border-box;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    position: relative;
    cursor: grab;
    padding-top: 10px;
}
#reader-scroll-viewport.is-dragging {
    cursor: grabbing !important;
}

#spread-card-wrapper {
    background: transparent;
    display: inline-flex;
    align-items: center; justify-content: center;
    position: relative;
    margin: 0 auto;
    vertical-align: top;
    opacity: 1;
    transform-origin: center top;
    will-change: transform;
    flex-shrink: 0;
}

.canvas-page {
    display: inline-block; width: auto; height: auto;
    background: #ffffff;
    pointer-events: none;
}
#page-canvas-left { border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.85); }
#page-canvas-right { display: none; border-radius: 0 4px 4px 0; border-left: 1px solid rgba(0,0,0,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.85); }

/* BARRE DE CONTRÔLE FLOTTANTE CENTRÉE AVEC DÉFILEMENT (SCRUBBER) */
#m-bottom-dock {
    position: fixed; bottom: 16px; left: 50%;
    transform: translate(-50%, 20px);
    background: rgba(10, 16, 28, 0.95); backdrop-filter: blur(20px);
    border: 1.5px solid rgba(223, 178, 86, 0.35); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 10px 16px 8px 16px; z-index: 150;
    box-shadow: 0 12px 40px rgba(0,0,0,0.88);
    width: 92%; max-width: 480px; box-sizing: border-box;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
}
#m-bottom-dock.dock-awake, #m-bottom-dock:hover, #m-bottom-dock:focus-within {
    opacity: 0.98 !important;
    pointer-events: auto !important;
    transform: translate(-50%, 0) !important;
}

/* Ligne 1 : Barre de défilement / Scrubber */
.dock-scrubber-row {
    width: 100%; display: flex; align-items: center; gap: 10px; position: relative;
}
.scrubber-edge-label {
    font-size: 11px; font-weight: 800; color: #8fa0ba; min-width: 22px; text-align: center;
}
.scrubber-track-container {
    flex: 1; position: relative; display: flex; align-items: center; height: 22px; cursor: pointer;
}
#reader-page-slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; background: rgba(255, 255, 255, 0.15);
    border-radius: 6px; outline: none; margin: 0; cursor: pointer; position: relative; z-index: 2;
}
#reader-page-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #dfb256; border: 2px solid #ffffff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.7), 0 0 10px rgba(223, 178, 86, 0.7);
    cursor: grab; transition: transform 0.12s ease, background 0.12s ease;
}
#reader-page-slider::-webkit-slider-thumb:hover, #reader-page-slider::-webkit-slider-thumb:active {
    transform: scale(1.25); background: #fce18b; cursor: grabbing;
}
#reader-page-slider::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: #dfb256; border: 2px solid #ffffff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.7), 0 0 10px rgba(223, 178, 86, 0.7);
    cursor: grab;
}
.scrubber-track-fill {
    position: absolute; left: 0; top: 8px; height: 6px;
    background: linear-gradient(90deg, #c35936, #dfb256);
    border-radius: 6px; pointer-events: none; z-index: 1;
    width: 0%;
}
.scrubber-bubble {
    position: absolute; bottom: 28px; left: 0; transform: translateX(-50%);
    background: #dfb256; color: #0a0f1d; font-size: 11.5px; font-weight: 900;
    padding: 4px 10px; border-radius: 12px; pointer-events: none; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(0,0,0,0.8);
    opacity: 0; transition: opacity 0.15s ease;
    z-index: 10;
}
.scrubber-bubble::after {
    content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent; border-top-color: #dfb256;
}
.scrubber-bubble.bubble-visible {
    opacity: 1;
}

/* Ligne 2 : Commandes */
.dock-controls-row {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px;
}
.dock-nav-btn {
    background: #182236; border: 1px solid rgba(255,255,255,0.25);
    color: #dfb256; padding: 5px 14px; border-radius: 14px; font-size: 14px; font-weight: 900;
    cursor: pointer; min-width: 38px; min-height: 32px; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
}
.dock-nav-btn:active { background: #dfb256; color: #111; transform: scale(0.96); }

.dock-page-jump {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    padding: 4px 10px; border-radius: 10px; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14); transition: background 0.15s ease, border-color 0.15s ease;
}
.dock-page-jump:hover {
    background: rgba(223,178,86,0.18); border-color: rgba(223,178,86,0.45);
}
#page-indicator-txt { font-size: 12.5px; font-weight: 900; color: #f7eedb; min-width: 75px; text-align: center; white-space: nowrap; }
.jump-hint-icon { font-size: 11px; color: #dfb256; opacity: 0.8; }

.dock-divider {
    width: 1px; height: 18px; background: rgba(255,255,255,0.2); margin: 0 1px;
}
.dock-zoom-btn {
    font-size: 17px !important; font-weight: 900 !important;
    padding: 4px 9px !important; min-width: 32px !important; min-height: 30px !important;
}
.dock-zoom-indicator {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(223,178,86,0.35);
    color: #dfb256; font-size: 11px; font-weight: 900; border-radius: 12px;
    padding: 4px 8px; cursor: pointer; transition: all 0.2s ease;
    white-space: nowrap; min-width: 44px; text-align: center;
}
.dock-zoom-indicator:hover, .dock-zoom-indicator:active {
    background: #dfb256; color: #111;
}
.dock-zoom-indicator.zoom-active {
    border-color: #dfb256; background: rgba(223,178,86,0.25); color: #ffd700;
}

/* CACHER LA BARRE DE ZOOM SUR TOUT MOBILE/TABLETTE */
#reader-zoom-bar { display: none !important; }

/* MODAL MARQUE-PAGES */
#bookmarks-dialog-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(4, 6, 12, 0.92); backdrop-filter: blur(25px);
    display: none; justify-content: center; align-items: center; z-index: 999;
    padding: 16px;
}
.dialog-box {
    background: #0f1628; border: 2px solid rgba(255,255,255,0.25);
    border-radius: 24px; padding: 26px 18px; width: 92%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.98); text-align: center;
}
.dialog-box-icon { font-size: 38px; margin-bottom: 8px; display: block; }
.dialog-box-title { font-size: 19px; font-weight: 900; color: #dfb256; text-transform: uppercase; }
.dialog-box-sub { font-size: 13px; font-weight: 700; color: #9ab0d0; margin-top: 4px; margin-bottom: 16px; }
.dialog-list { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin: 16px 0; text-align: left; }
.dialog-item {
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.18);
    padding: 12px 14px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; min-height: 50px;
}
.dialog-badge-side { font-size: 11px; font-weight: 900; padding: 4px 8px; border-radius: 10px; text-transform: uppercase; }
.dialog-page-label { font-size: 15px; font-weight: 800; color: #f7eedb; }
.btn-dialog-close {
    background: #dfb256; color: #111; font-weight: 900; font-size: 15px;
    padding: 14px 28px; border-radius: 25px; border: none; cursor: pointer; width: 100%;
    margin-top: 10px;
}

#toast-box {
    position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
    background: #dfb256; color: #111; font-weight: 900; font-size: 13px;
    padding: 9px 22px; border-radius: 25px; display: none; z-index: 1000;
    box-shadow: 0 8px 25px rgba(0,0,0,0.7);
}

/* SPINNER CHARGEMENT */
#reader-loading-spinner {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(12, 18, 32, 0.94); backdrop-filter: blur(20px);
    border: 1.5px solid rgba(223, 178, 86, 0.4); border-radius: 20px;
    padding: 22px 32px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    z-index: 200; box-shadow: 0 15px 50px rgba(0,0,0,0.95);
    text-align: center; pointer-events: none;
}
.spinner-ring {
    width: 42px; height: 42px; border: 3.5px solid rgba(223, 178, 86, 0.2);
    border-top: 3.5px solid #dfb256; border-radius: 50%;
    animation: spinRing 0.85s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
}
@keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.loading-txt-main { font-family: 'Cinzel', serif; font-size: 14px; font-weight: 900; color: #dfb256; letter-spacing: 1px; }
.loading-txt-sub { font-size: 11px; font-weight: 700; color: #9ab0d0; }
</style>
</head>
<body>

<div id="toast-box">Page mémorisée !</div>

<!-- TOP HEADER -->
<div id="m-header">
    <div class="header-inner-track">
        <div class="brand-zone" onclick="goToHome3D()" title="Accueil 3D">
            <span class="title-txt">9 ÉTAGES</span>
            <span id="badge-side" class="side-pill pill-terrain">TERRAIN</span>
            <span class="author-txt">Alexandre R.</span>
        </div>

        <div class="header-btns">
            <button class="btn-flip-act" onclick="flip3DTeteBeche()">🔄 RETOURNER</button>
            <button id="btn-save-bm" class="btn-h" onclick="toggleCurrentBookmark()">🔖 <span id="txt-bm-label">Marquer</span></button>
            <button class="btn-h" onclick="openBookmarksList()">📂 Marque-pages</button>
        </div>
    </div>
</div>

<!-- SCÈNE 3D DE L'ACCUEIL -->
<div id="stage-3d-box"></div>

<!-- BOUTON OUVRIR LE LIVRE DE L'ACCUEIL -->
<div id="home-3d-cta">
    <div class="cta-info-bubble">
        👆 Touchez & glissez pour manipuler à 360°
    </div>
    <button class="cta-btn-main" onclick="openReader()">
        OUVRIR LE LIVRE ➔
    </button>
</div>

<!-- LISEUSE NUMÉRIQUE -->
<div id="live-reader-container">
    <div id="reader-loading-spinner">
        <div class="spinner-ring"></div>
        <div class="loading-txt-main">CHARGEMENT DU MANUSCRIT</div>
        <div class="loading-txt-sub" id="loading-sub-progress">Préparation des pages haute définition...</div>
    </div>

    <!-- VIEWPORT DE LECTURE -->
    <div id="reader-scroll-viewport">
        <div id="spread-card-wrapper">
            <canvas id="page-canvas-left" class="canvas-page"></canvas>
            <canvas id="page-canvas-right" class="canvas-page"></canvas>
        </div>
    </div>

    <!-- COMMANDES FLOTTANTES DE NAVIGATION, BARRE DE DÉFILEMENT & ZOOM -->
    <div id="m-bottom-dock">
        <!-- LIGNE 1 : BARRE DE DÉFILEMENT DIRECTE (SCRUBBER) -->
        <div class="dock-scrubber-row">
            <span class="scrubber-edge-label" id="scrubber-start-label">1</span>
            <div class="scrubber-track-container">
                <input type="range" id="reader-page-slider" min="1" max="139" value="1" step="1"
                       oninput="onSliderInput(this.value)" onchange="onSliderChange(this.value)">
                <div class="scrubber-track-fill" id="scrubber-track-fill"></div>
                <div class="scrubber-bubble" id="scrubber-bubble">Page 1</div>
            </div>
            <span class="scrubber-edge-label" id="scrubber-end-label">139</span>
        </div>

        <!-- LIGNE 2 : COMMANDES ET ZOOM -->
        <div class="dock-controls-row">
            <button class="dock-nav-btn" onclick="prevStep()" title="Page précédente (Flèche Gauche)">◀</button>
            <div class="dock-page-jump" onclick="promptDirectPageJump()" title="Cliquer pour entrer directement un numéro de page">
                <span id="page-indicator-txt">Couverture</span>
                <span class="jump-hint-icon">✎</span>
            </div>
            <button class="dock-nav-btn" onclick="nextStep()" title="Page suivante (Flèche Droite)">▶</button>
            
            <div class="dock-divider"></div>
            
            <button class="dock-nav-btn dock-zoom-btn" onclick="zoomStep(-0.25)" title="Dézoomer (−)">−</button>
            <button class="dock-zoom-indicator" id="zoom-indicator-btn" onclick="resetZoom(true)" title="Réinitialiser à 100% (Touche 0)">100%</button>
            <button class="dock-nav-btn dock-zoom-btn" onclick="zoomStep(0.25)" title="Zoomer (+)">+</button>
        </div>
    </div>
</div>

<!-- MODAL MARQUE-PAGES -->
<div id="bookmarks-dialog-overlay">
    <div class="dialog-box">
        <span class="dialog-box-icon">🔖</span>
        <h3 class="dialog-box-title">Mes Marque-Pages</h3>
        <p class="dialog-box-sub">Accédez instantanément à vos pages</p>
        <div class="dialog-list" id="dialog-bm-items"></div>
        <button class="btn-dialog-close" onclick="closeBookmarksList()">Fermer ✕</button>
    </div>
</div>

<script>
const STORAGE_KEY = "LES_9_ETAGES_APP_STORAGE_MASTER_V5";

let currentSide = 'terrain';
let currentPage = 1;
let isReading = false;
let currentZoom = 1.0;
let panX = 0;
let panY = 0;
let baseContentW = 0;
let baseContentH = 0;
let displayMode = (window.innerWidth > 900) ? 'spread' : 'single';

let docTerrain = null;
let docSommet = null;

let scene, camera, renderer, bookMesh;
let isFlipping3D = false;
let isTouchDragging = false;
let prevTouchPos = { x: 0, y: 0 };
let renderTaskLeft = null;
let renderTaskRight = null;
let dockFadeTimeout = null;
let isDockScrubbing = false;

let userStore = {
    terrainLastPage: 1,
    sommetLastPage: 1,
    terrainBookmarks: [],
    sommetBookmarks: [],
    lastSide: 'terrain',
    preferredZoom: 1.0
};

function loadUserStore() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            userStore = JSON.parse(saved);
            currentSide = userStore.lastSide || 'terrain';
            currentPage = (currentSide === 'terrain') ? (userStore.terrainLastPage || 1) : (userStore.sommetLastPage || 1);
            if (userStore.preferredZoom && typeof userStore.preferredZoom === 'number') {
                currentZoom = Math.max(1.0, Math.min(3.5, userStore.preferredZoom));
            }
        } catch(e) {}
    } else {
        currentSide = 'terrain';
        currentPage = 1;
        currentZoom = 1.0;
    }
    updateBookmarkUI();
}

function saveUserStore() {
    if (currentSide === 'terrain') userStore.terrainLastPage = currentPage;
    else userStore.sommetLastPage = currentPage;
    userStore.lastSide = currentSide;
    userStore.preferredZoom = currentZoom;
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userStore));
    } catch(e) {}
    updateBookmarkUI();
}

function init3DStage() {
    const container = document.getElementById('stage-3d-box');
    if (!container) return;
    container.innerHTML = '';

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 9.2);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.60));
    const lKey = new THREE.DirectionalLight(0xffffff, 0.50);
    lKey.position.set(4, 6, 6); scene.add(lKey);
    const lFill = new THREE.DirectionalLight(0xffeedd, 0.25);
    lFill.position.set(-4, 3, 4); scene.add(lFill);
    const lRim = new THREE.DirectionalLight(0xdfb256, 0.20);
    lRim.position.set(0, -5, 4); scene.add(lRim);

    const geometry = new THREE.BoxGeometry(3.2, 4.5, 0.52);
    const loader = new THREE.TextureLoader();
    const tCover = loader.load('cover_terrain.jpg?v=20260911_v2', () => { if (renderer && scene && camera) renderer.render(scene, camera); });
    const sCover = loader.load('cover_sommet.jpg?v=20260911_v2', () => { if (renderer && scene && camera) renderer.render(scene, camera); });
    sCover.center.set(0.5, 0.5);
    sCover.rotation = Math.PI;

    const canvasP = document.createElement('canvas');
    canvasP.width = 128; canvasP.height = 512;
    const ctxP = canvasP.getContext('2d');
    ctxP.fillStyle = '#f7f5ee'; ctxP.fillRect(0,0,128,512);
    ctxP.fillStyle = '#ded9c8';
    for(let i=0; i<512; i+=4) ctxP.fillRect(0, i, 128, 1.5);
    const pTex = new THREE.CanvasTexture(canvasP);

    const spineTex = loader.load('cover_spine.jpg?v=20260911_v2', () => { if (renderer && scene && camera) renderer.render(scene, camera); });

    const materials = [
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: spineTex, roughness: 0.55, metalness: 0.05 }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: tCover, roughness: 0.55, metalness: 0.05 }),
        new THREE.MeshStandardMaterial({ map: sCover, roughness: 0.55, metalness: 0.05 })
    ];

    bookMesh = new THREE.Mesh(geometry, materials);
    if (currentSide === 'sommet') {
        bookMesh.rotation.set(0.15, Math.PI - 0.35, Math.PI);
    } else {
        bookMesh.rotation.set(0.15, -0.35, 0);
    }
    scene.add(bookMesh);

    const dom = renderer.domElement;
    dom.addEventListener('pointerdown', (e) => {
        isTouchDragging = true;
        prevTouchPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
        if (!isTouchDragging || !bookMesh) return;
        const deltaX = e.clientX - prevTouchPos.x;
        const deltaY = e.clientY - prevTouchPos.y;

        const deltaQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(
            deltaY * 0.008,
            deltaX * 0.008,
            0,
            'XYZ'
        ));
        bookMesh.quaternion.multiplyQuaternions(deltaQuat, bookMesh.quaternion);
        prevTouchPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => { isTouchDragging = false; });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (isReading) renderUniversalReader();
    });

    animate3DLoop();
    initAppCore();
}

function animate3DLoop(time) {
    requestAnimationFrame(animate3DLoop);
    if (typeof TWEEN !== 'undefined') TWEEN.update(time);
    if (!isFlipping3D && bookMesh && !isReading && !isTouchDragging) {
        bookMesh.position.y = Math.sin(time * 0.0015) * 0.08;
    }
    if (renderer && scene && camera) {
        renderer.render(scene, camera);
    }
}

async function initAppCore() {
    loadUserStore();
    updateSideBadge();
    docTerrain = await pdfjsLib.getDocument('terrain.pdf?v=20260920_v9').promise;
    docSommet = await pdfjsLib.getDocument('sommet.pdf?v=20260920_v9').promise;
    updateSideBadge();
    updateBookmarkUI();
    initDockFadeListeners();
    initTouchPan();
}

function wakeBottomDock(customDuration = 1500) {
    const dock = document.getElementById('m-bottom-dock');
    if (!dock) return;
    dock.classList.add('dock-awake');
    
    clearTimeout(dockFadeTimeout);
    if (!isDockScrubbing) {
        dockFadeTimeout = setTimeout(() => {
            if (dock && !isDockScrubbing) dock.classList.remove('dock-awake');
        }, customDuration);
    }
}

function hideBottomDock() {
    const dock = document.getElementById('m-bottom-dock');
    if (dock) {
        dock.classList.remove('dock-awake');
        clearTimeout(dockFadeTimeout);
    }
}

function toggleBottomDock() {
    const dock = document.getElementById('m-bottom-dock');
    if (!dock) return;
    if (dock.classList.contains('dock-awake')) {
        hideBottomDock();
    } else {
        wakeBottomDock(2500);
    }
}

function initDockFadeListeners() {
    const dock = document.getElementById('m-bottom-dock');
    if (dock) {
        dock.addEventListener('mouseenter', () => {
            isDockScrubbing = true;
            wakeBottomDock(3000);
        });
        dock.addEventListener('mouseleave', () => {
            isDockScrubbing = false;
            wakeBottomDock(1200);
        });
        dock.addEventListener('touchstart', (e) => {
            wakeBottomDock(3000);
        }, { passive: true });
    }

    const slider = document.getElementById('reader-page-slider');
    if (slider) {
        slider.addEventListener('mousedown', () => { isDockScrubbing = true; wakeBottomDock(3500); });
        slider.addEventListener('touchstart', () => { isDockScrubbing = true; wakeBottomDock(3500); }, { passive: true });
        slider.addEventListener('mouseup', () => { isDockScrubbing = false; wakeBottomDock(1500); });
        slider.addEventListener('touchend', () => { isDockScrubbing = false; wakeBottomDock(1500); });
    }

    window.addEventListener('keydown', () => wakeBottomDock(1800));
}

let isInitialOpen = true;

function showCenteredLoader(msg) {
    if (!isInitialOpen) return;
    const sp = document.getElementById('reader-loading-spinner');
    const sub = document.getElementById('loading-sub-progress');

}

function hideCenteredLoader() {
    const sp = document.getElementById('reader-loading-spinner');
    if (sp) sp.style.display = 'none';

}

function goToHome3D() {
    isReading = false;
    panX = 0;
    panY = 0;

async function openReader() {
    isReading = true;
    if (userStore.preferredZoom && typeof userStore.preferredZoom === 'number') {
        currentZoom = Math.max(1.0, Math.min(3.5, userStore.preferredZoom));
    }
    panX = 0;
    panY = 0;
    document.getElementById('live-reader-container').style.display = 'flex';
    document.getElementById('home-3d-cta').style.display = 'none';
    wakeBottomDock(2500);
    
    if (!docTerrain || !docSommet) {
        showCenteredLoader("Ouverture du manuscrit...");
        if (!docTerrain) docTerrain = await pdfjsLib.getDocument('terrain.pdf?v=20260920_v9').promise;
        if (!docSommet) docSommet = await pdfjsLib.getDocument('sommet.pdf?v=20260920_v9').promise;
    }
    renderUniversalReader();
}

async function renderUniversalReader() {
    if (renderTaskLeft) { try { renderTaskLeft.cancel(); } catch(e){} renderTaskLeft = null; }
    if (renderTaskRight) { try { renderTaskRight.cancel(); } catch(e){} renderTaskRight = null; }
    
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    if (!activeDoc) {
        showCenteredLoader("Chargement du document...");
        return;
    }

    if (isInitialOpen) showCenteredLoader();

    const totalPages = activeDoc.numPages;

    const isMobile = window.innerWidth <= 768;
    const effectiveMode = isMobile ? 'single' : displayMode;
    const isTwoPage = (effectiveMode === 'spread' && currentPage > 1 && currentPage < totalPages);
    
    let pLabel = "";
    if (currentPage === 1) {
        pLabel = "Couverture";
    } else if (isTwoPage) {
        const rightP = Math.min(currentPage + 1, totalPages);
        pLabel = `p. ${currentPage - 1}-${rightP - 1} / ${totalPages - 1}`;
    } else {
        pLabel = `p. ${currentPage - 1} / ${totalPages - 1}`;
    }

    if (document.getElementById('page-indicator-txt')) document.getElementById('page-indicator-txt').innerText = pLabel;

    const wrapper = document.getElementById('spread-card-wrapper');
    const cLeft = document.getElementById('page-canvas-left');
    const cRight = document.getElementById('page-canvas-right');
    if (!wrapper || !cLeft || !cRight) {
        hideCenteredLoader();
        return;
    }

    try {
        const screenW = window.innerWidth;
        // Hauteur réservée : Header (56px) + padding-top (10px) + dock de navigation en bas (92px mobile, 80px bureau)
        const dockReservedH = isMobile ? 92 : 80;
        const availH = window.innerHeight - 56 - 10 - dockReservedH;

        const pageL = await activeDoc.getPage(currentPage);
        const unscaledVpL = pageL.getViewport({ scale: 1.0 });
        // Rendu supersample haute définition : netteté absolue même à fort grossissement
        const dpr = Math.min(Math.max(window.devicePixelRatio || 1, 2.0) * 1.35, 3.2);

        if (!isTwoPage) {
            // MODE 1 PAGE
            cRight.style.display = 'none';
            cLeft.style.display = 'block';
            cLeft.style.borderRadius = '4px';

            const maxFitW = isMobile ? (screenW - 20) : (screenW * 0.90);
            const maxFitH = availH * 0.98;

            let displayW = maxFitW;
            let displayH = displayW * (unscaledVpL.height / unscaledVpL.width);

            if (displayH > maxFitH) {
                displayH = maxFitH;
                displayW = displayH * (unscaledVpL.width / unscaledVpL.height);
            }

            const renderScale = (displayW / unscaledVpL.width) * dpr;
            const vp = pageL.getViewport({ scale: renderScale });

            const offL = document.createElement('canvas');
            offL.width = vp.width;
            offL.height = vp.height;
            const ctxOffL = offL.getContext('2d');
            ctxOffL.imageSmoothingEnabled = true; ctxOffL.imageSmoothingQuality = 'high';

            renderTaskLeft = pageL.render({ canvasContext: ctxOffL, viewport: vp });
            await renderTaskLeft.promise;

            cLeft.width = vp.width;
            cLeft.height = vp.height;
            cLeft.style.width = `${Math.round(displayW)}px`;
            cLeft.style.height = `${Math.round(displayH)}px`;
            const ctxL = cLeft.getContext('2d');
            ctxL.drawImage(offL, 0, 0);

            baseContentW = Math.round(displayW);
            baseContentH = Math.round(displayH);
            wrapper.style.width = `${baseContentW}px`;
            wrapper.style.height = `${baseContentH}px`;

        } else {
            // MODE 2 PAGES
            cRight.style.display = 'block';
            cLeft.style.display = 'block';
            cLeft.style.borderRadius = '4px 0 0 4px';
            cRight.style.borderRadius = '0 4px 4px 0';

            const rightPageNum = Math.min(currentPage + 1, totalPages);
            const pageR = await activeDoc.getPage(rightPageNum);
            const unscaledVpR = pageR.getViewport({ scale: 1.0 });

            const maxFitW = screenW * 0.92;
            const maxFitH = availH * 0.90;

            let displayH = maxFitH;
            let displaySingleW = displayH * (unscaledVpL.width / unscaledVpL.height);

            if (displaySingleW * 2 > maxFitW) {
                displaySingleW = maxFitW / 2;
                displayH = displaySingleW * (unscaledVpL.height / unscaledVpL.width);
            }

            const scaleL = (displaySingleW / unscaledVpL.width) * dpr;
            const scaleR = (displaySingleW / unscaledVpR.width) * dpr;

            const vpL = pageL.getViewport({ scale: scaleL });
            const vpR = pageR.getViewport({ scale: scaleR });

            const offL = document.createElement('canvas');
            offL.width = vpL.width; offL.height = vpL.height;
            const offR = document.createElement('canvas');
            offR.width = vpR.width; offR.height = vpR.height;

            const ctxOffL = offL.getContext('2d');
            const ctxOffR = offR.getContext('2d');
            ctxOffL.imageSmoothingEnabled = true; ctxOffL.imageSmoothingQuality = 'high';
            ctxOffR.imageSmoothingEnabled = true; ctxOffR.imageSmoothingQuality = 'high';

            renderTaskLeft = pageL.render({ canvasContext: ctxOffL, viewport: vpL });
            renderTaskRight = pageR.render({ canvasContext: ctxOffR, viewport: vpR });
            await Promise.all([renderTaskLeft.promise, renderTaskRight.promise]);

            cLeft.width = vpL.width;
            cLeft.height = vpL.height;
            cLeft.style.width = `${Math.round(displaySingleW)}px`;
            cLeft.style.height = `${Math.round(displayH)}px`;
            cLeft.getContext('2d').drawImage(offL, 0, 0);

            cRight.width = vpR.width;
            cRight.height = vpR.height;
            cRight.style.width = `${Math.round(displaySingleW)}px`;
            cRight.style.height = `${Math.round(displayH)}px`;
            cRight.getContext('2d').drawImage(offR, 0, 0);

            baseContentW = Math.round(displaySingleW * 2);
            baseContentH = Math.round(displayH);
            wrapper.style.width = `${baseContentW}px`;
            wrapper.style.height = `${baseContentH}px`;
        }

        applyReaderTransform(false);
        updateSliderUI(currentPage, totalPages);
    } catch(err) {
        if (err.name !== 'RenderingCancelledException') {
            console.error("PDF Render Error:", err);
        }
    } finally {
        hideCenteredLoader();
    }

    saveUserStore();
}

function nextStep() {
    wakeBottomDock();
    // Conserver le zoom choisi, replacer la vue en haut de la nouvelle page
    panX = 0;
    panY = 0;
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    const maxP = activeDoc ? activeDoc.numPages : 170;
    const isMobile = window.innerWidth <= 768;
    const effectiveMode = isMobile ? 'single' : displayMode;
    const step = (effectiveMode === 'spread' && currentPage > 1 && currentPage < maxP - 1) ? 2 : 1;
    
    if (currentPage === 1) {
        currentPage = 2;
    } else if (currentPage + step <= maxP) {
        currentPage += step;
    } else {
        currentPage = maxP;
    }
    renderUniversalReader();
}

function prevStep() {
    wakeBottomDock();
    // Conserver le zoom choisi, replacer la vue en haut de la page précédente
    panX = 0;
    panY = 0;
    const isMobile = window.innerWidth <= 768;
    const effectiveMode = isMobile ? 'single' : displayMode;
    const step = (effectiveMode === 'spread' && currentPage > 2) ? 2 : 1;
    
    if (currentPage - step >= 2) {
        currentPage -= step;
    } else if (currentPage > 1) {
        currentPage = 1;
    }
    renderUniversalReader();
}

function flip3DTeteBeche() {
    if (isFlipping3D) return;
    isFlipping3D = true;
    panX = 0;
    panY = 0;

    currentSide = (currentSide === 'terrain') ? 'sommet' : 'terrain';
    currentPage = (currentSide === 'terrain') ? (userStore.terrainLastPage || 1) : (userStore.sommetLastPage || 1);

    const targetY = (currentSide === 'sommet') ? Math.PI - 0.35 : -0.35;
    const targetZ = (currentSide === 'sommet') ? Math.PI : 0;

    new TWEEN.Tween(bookMesh.rotation)
        .to({ y: targetY, z: targetZ, x: 0.15 }, 1200)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onComplete(() => { isFlipping3D = false; })
        .start();

    updateSideBadge();
    if (isReading) renderUniversalReader();
}

function updateSideBadge() {
    const b = document.getElementById('badge-side');
    if (currentSide === 'terrain') {
        b.className = "side-pill pill-terrain";
        b.innerText = "TERRAIN";
    } else {
        b.className = "side-pill pill-sommet";
        b.innerText = "SOMMET";
    }
}

function toggleCurrentBookmark() {
    const list = (currentSide === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const idx = list.indexOf(currentPage);
    const pLabel = (currentPage === 1) ? "Couverture" : `Page ${currentPage - 1}`;
    if (idx === -1) {
        list.push(currentPage);
        list.sort((a,b) => a - b);
        showToastAlert(`🔖 ${pLabel} mémorisée !`);
    } else {
        list.splice(idx, 1);
        showToastAlert(`Marque-page retiré`);
    }
    saveUserStore();
}

function updateBookmarkUI() {
    const list = (currentSide === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const isBm = list.includes(currentPage);
    
    const btn = document.getElementById('btn-save-bm');
    const label = document.getElementById('txt-bm-label');
    if (btn && label) {
        if (isBm) {
            btn.classList.add('active-bm');
            label.innerText = "Mémorisée ★";
        } else {
            btn.classList.remove('active-bm');
            label.innerText = "Marquer";
        }
    }
}

function openBookmarksList() {
    const c = document.getElementById('dialog-bm-items');
    c.innerHTML = '';
    
    const all = [];
    (userStore.terrainBookmarks || []).forEach(p => all.push({ side: 'terrain', page: p }));
    (userStore.sommetBookmarks || []).forEach(p => all.push({ side: 'sommet', page: p }));

    if (all.length === 0) {
        c.innerHTML = '<div style="font-size:14px; font-weight:700; color:#889bb8; text-align:center; padding:20px;">Aucun marque-page enregistré.<br><span style="font-size:12px; font-weight:600; opacity:0.8;">Utilisez le bouton 🔖 Marquer en cours de lecture.</span></div>';
    } else {
        all.forEach(item => {
            const row = document.createElement('div');
            row.className = 'dialog-item';
            const badgeBg = (item.side === 'terrain') ? '#c35936' : '#133968';
            const pTxt = (item.page === 1) ? "Couverture" : `Page ${item.page - 1}`;
            row.innerHTML = `
                <div onclick="jumpToBm('${item.side}', ${item.page})" style="display:flex; align-items:center; gap:10px; flex:1;">
                    <span class="dialog-badge-side" style="background:${badgeBg}; color:#fff;">${item.side}</span>
                    <span class="dialog-page-label">${pTxt}</span>
                </div>
                <button onclick="delBmItem('${item.side}', ${item.page}, event)" style="background:transparent; border:none; color:#ff5555; font-size:20px; padding:4px; cursor:pointer;" title="Supprimer">🗑️</button>
            `;
            c.appendChild(row);
        });
    }

    document.getElementById('bookmarks-dialog-overlay').style.display = 'flex';
}

function closeBookmarksList() {
    document.getElementById('bookmarks-dialog-overlay').style.display = 'none';
}

function jumpToBm(side, pageNum) {
    closeBookmarksList();
    panX = 0;
    panY = 0;
    currentSide = side;
    currentPage = pageNum;
    updateSideBadge();
    if (!isReading) openReader();
    else renderUniversalReader();
}

function delBmItem(side, pageNum, event) {
    event.stopPropagation();
    const list = (side === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const idx = list.indexOf(pageNum);
    if (idx !== -1) {
        list.splice(idx, 1);
        saveUserStore();
        openBookmarksList();
    }
}

function showToastAlert(txt) {
    const t = document.getElementById('toast-box');
    t.innerText = txt; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2200);
}

// ===================================================
// BARRE DE DÉFILEMENT (SCRUBBER) & NAVIGATION DIRECTE
// ===================================================

function updateSliderUI(pageNum, totalPages) {
    const slider = document.getElementById('reader-page-slider');
    const fill = document.getElementById('scrubber-track-fill');
    const endLbl = document.getElementById('scrubber-end-label');
    if (!slider) return;

    slider.max = totalPages;
    slider.value = pageNum;
    if (endLbl) endLbl.innerText = totalPages;

    const pct = ((pageNum - 1) / Math.max(1, totalPages - 1)) * 100;
    if (fill) fill.style.width = `${Math.min(100, Math.max(0, pct))}%`;
}

function onSliderInput(val) {
    isDockScrubbing = true;
    wakeBottomDock(3500);
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    const totalPages = activeDoc ? activeDoc.numPages : 139;
    const p = parseInt(val, 10);

    const fill = document.getElementById('scrubber-track-fill');
    const bubble = document.getElementById('scrubber-bubble');
    const slider = document.getElementById('reader-page-slider');

    const pct = ((p - 1) / Math.max(1, totalPages - 1)) * 100;
    if (fill) fill.style.width = `${Math.min(100, Math.max(0, pct))}%`;

    if (bubble && slider) {
        bubble.classList.add('bubble-visible');
        let label = (p === 1) ? "Couverture" : `Page ${p - 1} / ${totalPages - 1}`;
        bubble.innerText = label;
        const sliderWidth = slider.offsetWidth || 300;
        const thumbPos = (pct / 100) * sliderWidth;
        bubble.style.left = `${thumbPos}px`;
    }
}

function onSliderChange(val) {
    isDockScrubbing = false;
    wakeBottomDock(1500);
    const bubble = document.getElementById('scrubber-bubble');
    if (bubble) bubble.classList.remove('bubble-visible');

    let p = parseInt(val, 10);
    const isMobile = window.innerWidth <= 768;
    const effectiveMode = isMobile ? 'single' : displayMode;
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    const totalPages = activeDoc ? activeDoc.numPages : 139;

    if (effectiveMode === 'spread' && p > 1 && p % 2 === 1 && p < totalPages) {
        p = p - 1;
    }

    currentPage = p;
    panX = 0;
    panY = 0;
    renderUniversalReader();
}

function promptDirectPageJump() {
    wakeBottomDock();
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    const totalPages = activeDoc ? activeDoc.numPages : 139;
    const currentReadable = (currentPage === 1) ? 1 : (currentPage - 1);

    const ans = prompt(`Aller directement à la page (1 à ${totalPages - 1}) :`, currentReadable);
    if (!ans) return;
    const num = parseInt(ans.trim(), 10);
    if (isNaN(num)) return;

    let targetPage = (num <= 1) ? 1 : Math.min(num + 1, totalPages);
    const isMobile = window.innerWidth <= 768;
    const effectiveMode = isMobile ? 'single' : displayMode;
    if (effectiveMode === 'spread' && targetPage > 1 && targetPage % 2 === 1 && targetPage < totalPages) {
        targetPage = targetPage - 1;
    }

    currentPage = targetPage;
    panX = 0;
    panY = 0;
    renderUniversalReader();
}

// ===================================================
// GESTION DU ZOOM FLUIDE & DU PANNING (DÉPLACEMENT)
// ===================================================

function clampPan() {
    const vp = document.getElementById('reader-scroll-viewport');
    if (!vp || !baseContentW || !baseContentH) return;

    const vpW = vp.clientWidth;
    const vpH = vp.clientHeight;
    const scaledW = baseContentW * currentZoom;
    const scaledH = baseContentH * currentZoom;

    if (currentZoom <= 1.02) {
        panX = 0;
        panY = 0;
        return;
    }

    let maxPanX = (scaledW > vpW) ? ((scaledW - vpW) / 2 + 50) : 30;
    panX = Math.max(-maxPanX, Math.min(maxPanX, panX));

    if (scaledH > vpH) {
        let minPanY = -(scaledH - vpH + 50);
        let maxPanY = 30;
        panY = Math.max(minPanY, Math.min(maxPanY, panY));
    } else {
        panY = Math.max(-30, Math.min(30, panY));
    }
}

function applyReaderTransform(withTransition = false) {
    const wrapper = document.getElementById('spread-card-wrapper');
    if (!wrapper) return;

    clampPan();

    if (withTransition) {
        wrapper.style.transition = 'transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1)';
    } else {
        wrapper.style.transition = 'none';
    }

    wrapper.style.transform = `translate3d(${Math.round(panX)}px, ${Math.round(panY)}px, 0) scale(${currentZoom})`;

    const zoomBtn = document.getElementById('zoom-indicator-btn');
    if (zoomBtn) {
        const pct = Math.round(currentZoom * 100);
        zoomBtn.innerText = `${pct}%`;
        if (currentZoom > 1.05 || currentZoom < 0.95) {
            zoomBtn.classList.add('zoom-active');
        } else {
            zoomBtn.classList.remove('zoom-active');
        }
    }
}

function zoomAtPoint(newZoom, cursorX, cursorY, withTransition = false) {
    newZoom = Math.max(1.0, Math.min(3.5, +newZoom.toFixed(2)));
    if (Math.abs(newZoom - currentZoom) < 0.005) return;

    const ratio = newZoom / currentZoom;
    panX = cursorX - (cursorX - panX) * ratio;
    panY = cursorY - (cursorY - panY) * ratio;
    currentZoom = newZoom;

    if (currentZoom <= 1.02) {
        currentZoom = 1.0;
        panX = 0;
        panY = 0;
    }

    applyReaderTransform(withTransition);
    userStore.preferredZoom = currentZoom;
    saveUserStore();
}

function zoomStep(delta, withTransition = true) {
    wakeBottomDock();
    const target = Math.max(1.0, Math.min(3.5, +(currentZoom + delta).toFixed(2)));
    zoomAtPoint(target, 0, 0, withTransition);
}

function resetZoom(withTransition = true) {
    wakeBottomDock();
    currentZoom = 1.0;
    panX = 0;
    panY = 0;
    applyReaderTransform(withTransition);
    userStore.preferredZoom = 1.0;
    saveUserStore();
}

function handleDoubleAction(clientX, clientY) {
    const vp = document.getElementById('reader-scroll-viewport');
    if (!vp) return;
    wakeBottomDock();
    const vpRect = vp.getBoundingClientRect();
    const cursorX = clientX - (vpRect.left + vpRect.width / 2);
    const cursorY = clientY - (vpRect.top + vpRect.height / 2);

    if (currentZoom > 1.15) {
        resetZoom(true);
    } else {
        zoomAtPoint(1.6, cursorX, cursorY, true);
    }
}

function getDistanceBetweenTouches(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

function getTouchesMidpoint(t1, t2, vpEl) {
    const vpRect = vpEl.getBoundingClientRect();
    const mx = (t1.clientX + t2.clientX) / 2;
    const my = (t1.clientY + t2.clientY) / 2;
    return {
        x: mx - (vpRect.left + vpRect.width / 2),
        y: my - (vpRect.top + vpRect.height / 2)
    };
}

function initTouchPan() {
    const vp = document.getElementById('reader-scroll-viewport');
    if (!vp) return;

    let isMouseDown = false;
    let mouseStartX = 0, mouseStartY = 0;
    let startPanX = 0, startPanY = 0;
    let hasMovedMouse = false;
    let lastClickTime = 0;

    // 1. GESTION SOURIS (BUREAU / DRAG FLUIDE)
    vp.addEventListener('mousedown', (e) => {
        if (!isReading) return;
        if (e.button !== 0) return;
        wakeBottomDock();

        const now = Date.now();
        if (now - lastClickTime < 320) {
            lastClickTime = 0;
            handleDoubleAction(e.clientX, e.clientY);
            return;
        }
        lastClickTime = now;

        isMouseDown = true;
        hasMovedMouse = false;
        mouseStartX = e.clientX;
        mouseStartY = e.clientY;
        startPanX = panX;
        startPanY = panY;
        vp.classList.add('is-dragging');
    });

    window.addEventListener('mousemove', (e) => {
        if (!isReading || !isMouseDown) return;

        const dx = e.clientX - mouseStartX;
        const dy = e.clientY - mouseStartY;

        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
            hasMovedMouse = true;
        }

        if (currentZoom > 1.05) {
            panX = startPanX + dx;
            panY = startPanY + dy;
            applyReaderTransform(false);
        } else {
            panX = dx * 0.35;
            applyReaderTransform(false);
        }
    });

    window.addEventListener('mouseup', (e) => {
        if (!isReading || !isMouseDown) return;
        isMouseDown = false;
        vp.classList.remove('is-dragging');

        if (currentZoom <= 1.05) {
            const dx = e.clientX - mouseStartX;
            const dy = e.clientY - mouseStartY;
            if (hasMovedMouse && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.3) {
                if (dx < 0) nextStep();
                else prevStep();
            } else if (!hasMovedMouse) {
                toggleBottomDock();
            }
            panX = 0;
            panY = 0;
            applyReaderTransform(true);
        } else {
            if (!hasMovedMouse) {
                toggleBottomDock();
            }
            clampPan();
            applyReaderTransform(true);
        }
    });

    // 2. ZOOM MOLETTE SOURIS & TRACKPAD
    vp.addEventListener('wheel', (e) => {
        if (!isReading) return;
        wakeBottomDock();
        e.preventDefault();

        const vpRect = vp.getBoundingClientRect();
        const cursorX = e.clientX - (vpRect.left + vpRect.width / 2);
        const cursorY = e.clientY - (vpRect.top + vpRect.height / 2);

        if (e.ctrlKey || e.metaKey) {
            // Pincement trackpad ou Ctrl+Molette -> Zoom fluide continu
            const zoomDelta = -e.deltaY * 0.006;
            const targetZoom = Math.max(1.0, Math.min(3.5, currentZoom + zoomDelta));
            zoomAtPoint(targetZoom, cursorX, cursorY, false);
        } else {
            // Défilement 2 doigts / molette -> Panoramique fluide
            if (currentZoom > 1.02) {
                panX -= e.deltaX;
                panY -= e.deltaY;
                applyReaderTransform(false);
            } else {
                if (Math.abs(e.deltaX) > 40) {
                    if (e.deltaX > 40) nextStep();
                    else prevStep();
                }
            }
        }
    }, { passive: false });

    // 3. GESTES TACTILES (MOBILE / TABLETTE)
    let isTouchDragging = false;
    let isTouchPinching = false;
    let touchStartX = 0, touchStartY = 0;
    let touchLastX = 0, touchLastY = 0;
    let touchStartTime = 0;
    let initialPinchDist = 0;
    let initialPinchZoom = 1.0;
    let pinchMidX = 0, pinchMidY = 0;
    let lastTapTime = 0;

    vp.addEventListener('touchstart', (e) => {
        if (!isReading) return;
        wakeBottomDock();

        if (e.touches.length === 2) {
            isTouchPinching = true;
            isTouchDragging = false;
            initialPinchDist = getDistanceBetweenTouches(e.touches[0], e.touches[1]);
            initialPinchZoom = currentZoom;
            const mid = getTouchesMidpoint(e.touches[0], e.touches[1], vp);
            pinchMidX = mid.x;
            pinchMidY = mid.y;
        } else if (e.touches.length === 1) {
            const now = Date.now();
            if (now - lastTapTime < 320) {
                lastTapTime = 0;
                handleDoubleAction(e.touches[0].clientX, e.touches[0].clientY);
                return;
            }
            lastTapTime = now;

            isTouchPinching = false;
            isTouchDragging = true;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchLastX = touchStartX;
            touchLastY = touchStartY;
            touchStartTime = now;
            startPanX = panX;
            startPanY = panY;
        }
    }, { passive: false });

    vp.addEventListener('touchmove', (e) => {
        if (!isReading) return;

        if (isTouchPinching && e.touches.length === 2) {
            e.preventDefault();
            const dist = getDistanceBetweenTouches(e.touches[0], e.touches[1]);
            if (initialPinchDist > 0) {
                const factor = dist / initialPinchDist;
                const targetZoom = initialPinchZoom * factor;
                zoomAtPoint(targetZoom, pinchMidX, pinchMidY, false);
            }
        } else if (isTouchDragging && e.touches.length === 1 && !isTouchPinching) {
            const cx = e.touches[0].clientX;
            const cy = e.touches[0].clientY;
            const dx = cx - touchLastX;
            const dy = cy - touchLastY;
            touchLastX = cx;
            touchLastY = cy;

            if (currentZoom > 1.05) {
                e.preventDefault();
                panX += dx;
                panY += dy;
                applyReaderTransform(false);
            } else {
                const totalDx = cx - touchStartX;
                panX = totalDx * 0.35;
                applyReaderTransform(false);
            }
        }
    }, { passive: false });

    vp.addEventListener('touchend', (e) => {
        if (!isReading) return;

        if (isTouchPinching) {
            if (e.touches.length < 2) {
                isTouchPinching = false;
                if (currentZoom <= 1.02) {
                    resetZoom(true);
                } else {
                    clampPan();
                    applyReaderTransform(true);
                    userStore.preferredZoom = currentZoom;
                    saveUserStore();
                }
            }
            return;
        }

        if (isTouchDragging) {
            isTouchDragging = false;
            const endX = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : touchLastX;
            const endY = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : touchLastY;
            const totalDx = endX - touchStartX;
            const totalDy = endY - touchStartY;
            const elapsed = Date.now() - touchStartTime;

            if (currentZoom <= 1.05) {
                if (elapsed < 450 && Math.abs(totalDx) > 45 && Math.abs(totalDx) > Math.abs(totalDy) * 1.3) {
                    if (totalDx < 0) nextStep();
                    else prevStep();
                } else if (elapsed < 320 && Math.abs(totalDx) < 15 && Math.abs(totalDy) < 15) {
                    toggleBottomDock();
                }
                panX = 0;
                panY = 0;
                applyReaderTransform(true);
            } else {
                if (elapsed < 320 && Math.abs(totalDx) < 15 && Math.abs(totalDy) < 15) {
                    toggleBottomDock();
                }
                clampPan();
                applyReaderTransform(true);
            }
        }
    });

    vp.addEventListener('touchcancel', () => {
        isTouchPinching = false;
        isTouchDragging = false;
        clampPan();
        applyReaderTransform(true);
    });

    // 4. RACCOURCIS CLAVIER
    window.addEventListener('keydown', (e) => {
        if (!isReading) return;
        wakeBottomDock();

        if (e.key === 'ArrowRight' || e.key === 'PageDown') {
            e.preventDefault();
            nextStep();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
            e.preventDefault();
            prevStep();
        } else if (e.key === '+' || e.key === '=') {
            e.preventDefault();
            zoomStep(0.25);
        } else if (e.key === '-' || e.key === '_') {
            e.preventDefault();
            zoomStep(-0.25);
        } else if (e.key === '0' || e.key === 'Escape') {
            e.preventDefault();
            resetZoom(true);
        }
    });
}

window.onload = () => {
    init3DStage();
};
</script>
</body>
</html>
