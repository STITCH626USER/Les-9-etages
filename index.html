<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html {
    width: 100%; height: 100%; overflow: hidden;
    background: #060911; font-family: 'Plus Jakarta Sans', sans-serif;
    color: #f7eedb; user-select: none; -webkit-tap-highlight-color: transparent;
}

/* =================================================== */
/* RESPONSIVE HEADER & LARGE TOUCH BUTTONS */
/* =================================================== */
#m-header {
    height: 56px; width: 100%; background: #0c101c;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 10px; position: fixed; top: 0; left: 0; z-index: 200;
}
.brand-zone { display: flex; align-items: center; gap: 6px; }
.title-txt {
    font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700;
    letter-spacing: 1px; color: #f7eedb; white-space: nowrap;
}
.side-pill {
    padding: 3px 7px; border-radius: 10px; font-size: 9px; font-weight: 800;
    text-transform: uppercase;
}
.pill-terrain { background: #c35936; color: #fff; }
.pill-sommet { background: #133968; color: #dfb256; }

.header-btns { display: flex; align-items: center; gap: 5px; }
.btn-h {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #f7eedb; padding: 6px 9px; border-radius: 14px; font-size: 11px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 3px; min-height: 32px;
}
.btn-h.active-bm { background: #dfb256; color: #111; font-weight: 800; }
.btn-flip-act {
    background: linear-gradient(135deg, #c35936 0%, #dfb256 100%);
    color: #111; font-weight: 900; font-size: 11px; border: none;
    padding: 7px 11px; border-radius: 14px; cursor: pointer; min-height: 32px;
}

/* ZOOM TOOLBAR BIEN LISIBLE ET CENTRÉE */
#reader-zoom-bar {
    position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
    background: rgba(14, 20, 32, 0.95); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 25px;
    padding: 6px 16px; display: flex; align-items: center; gap: 10px;
    z-index: 120; font-size: 12px; font-weight: 800;
    box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    opacity: 0.9 !important; /* Always readable */
}
.btn-zoom-step {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    color: #dfb256; width: 28px; height: 28px; border-radius: 8px; font-size: 14px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.btn-mode-pill {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #f7eedb; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 12px;
    cursor: pointer;
}

/* LISEUSE VIEWPORT & SPREAD CARD */
#live-reader-container {
    position: fixed; top: 56px; left: 0; width: 100%; height: calc(100% - 56px);
    display: none; justify-content: center; align-items: center;
    background: #080b13; z-index: 90; overflow: hidden;
}
#reader-scroll-viewport {
    width: 100%; height: 100%;
    overflow-y: auto; overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 8px 75px 8px;
}
#spread-card-wrapper {
    background: #ffffff; border-radius: 6px;
    box-shadow: 0 15px 45px rgba(0,0,0,0.85);
    position: relative; margin: 0 auto;
    flex-shrink: 0;
}

/* BOTTOM DOCK BIEN LISIBLE */
#m-bottom-dock {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    width: 94%; max-width: 440px; height: 48px;
    background: rgba(12, 16, 28, 0.96); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 25px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 14px; z-index: 150;

}
.dock-nav-btn {

    color: #f7eedb; padding: 6px 14px; border-radius: 15px; font-size: 12px; font-weight: 800;
    cursor: pointer;
}
.brand-zone { display: flex; align-items: center; gap: 8px; }
.title-txt {
    font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; color: #f7eedb;
}
.side-pill {
    padding: 4px 10px; border-radius: 12px; font-size: 9px; font-weight: 800;

}
.pill-terrain { background: #c35936; color: #fff; box-shadow: 0 0 10px rgba(195,89,54,0.4); }

.header-btns { display: flex; align-items: center; gap: 8px; }

/* 3D HOME STAGE FULLSCREEN */
#stage-3d-box {

}
#home-3d-cta {

/* =================================================== */
/* LISEUSE UNIVERSELLE RESPONSIVE (1 PAGE OU 2 PAGES) */
/* =================================================== */
#live-reader-container {
    position: fixed; top: 56px; left: 0; width: 100%; height: calc(100% - 56px);

/* AUTO-FADE INTÉLIGENT DES COMMANDES (QUASI INVISIBLE AU REPOS, SE RALLUME À L'ACTIVITÉ) */
.auto-fade-ui {
    opacity: 0.15 !important;
    transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s ease, box-shadow 0.3s ease !important;

}

#reader-zoom-bar {

    transition: opacity 0.45s ease, transform 0.3s ease;
}
#reader-zoom-bar:hover, #reader-zoom-bar.ui-active {

#m-bottom-dock {
    opacity: 0.15;
    transition: opacity 0.45s ease, transform 0.3s ease;
}

    transform: translateX(-50%) translateY(-2px);

}

.nav-side-arrow {
    opacity: 0.2;
    transition: opacity 0.4s ease, transform 0.2s ease;
}
.nav-side-arrow:hover, .nav-side-arrow.ui-active {
    opacity: 1;

/* SCROLLABLE VIEWPORT ZOOM FIX AVEC TRANSFORM SCALE 100% CENTRÉ */
#reader-scroll-viewport {
    width: 100%; height: 100%;

}

    box-shadow: 0 20px 60px rgba(0,0,0,0.9);

    transform-origin: top center;

}

/* OMBRE CENTRALE DU PLI DE RELIURE SUR GRAND ÉCRAN (2 PAGES) */
.spread-binding-shadow {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 26px; height: 100%;
    background: linear-gradient(90deg, rgba(0,0,0,0.14) 0%, rgba(0,0,0,0.02) 50%, rgba(0,0,0,0.14) 100%);

}

/* TOP ZOOM & DISPLAY TOOLBAR (20% STEPS, 100% CENTRÉ) */
#reader-zoom-bar {
    position: fixed; top: 62px; left: 50%; transform: translateX(-50%);
    background: rgba(14, 20, 32, 0.94); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 25px;
    padding: 5px 16px; display: flex; align-items: center; gap: 10px;

}

    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);

}
.btn-zoom-step:hover { background: #dfb256; color: #111; }

/* SIDE ARROWS SUR DESKTOP */
.nav-side-arrow {
    position: fixed; top: 50%; transform: translateY(-50%);

/* TAP ZONES SUR MOBILE (POINTER-EVENTS NONE PAR DÉFAUT POUR LAISSER SCROLLER) */
.tap-zones-layer {
    position: fixed; top: 100px; left: 0; width: 100%; height: calc(100% - 170px);
    display: none; z-index: 95; pointer-events: none;
}
.tap-zone-l { width: 25%; height: 100%; pointer-events: auto; }

/* BOTTOM FIXED DOCK (SANS GLITCH) */
#m-bottom-dock {

    width: 94%; max-width: 440px; height: 48px;

/* BOOKMARKS MODAL */

<body>

<div id="toast-box">Page mémorisée !</div>

<!-- TOP HEADER -->
<div id="m-header">
    <div class="brand-zone">
        <span class="title-txt">9 ÉTAGES</span>
        <span id="badge-side" class="side-pill pill-terrain">TERRAIN</span>
    </div>

    <div class="header-btns">
        <button id="btn-save-bm" class="btn-h" onclick="toggleCurrentBookmark()">🔖 <span id="txt-bm-label">Marquer</span></button>
        <button class="btn-h" onclick="openBookmarksList()">📂 <span id="txt-bm-total">Pages (0)</span></button>
        <button id="btn-toggle-layout" class="btn-h" onclick="manualToggleLayout()">📐 Auto</button>
        <button class="btn-flip-act" onclick="flip3DTeteBeche()">🔄 RETOURNER</button>
    </div>
</div>

<!-- 3D WEBGL STAGE -->
<div id="stage-3d-box"></div>

<!-- 3D HOME CTA -->
<div id="home-3d-cta">
    <div style="font-size:11px; color:#889bb8; background:rgba(12,16,28,0.85); padding:6px 14px; border-radius:15px; border:1px solid rgba(255,255,255,0.1);">
        👆 Touchez & glissez pour manipuler à 360°
    </div>
    <button class="cta-btn-main" onclick="openReader()">
        OUVRIR LE LIVRE ➔
    </button>
</div>

<!-- LISEUSE UNIVERSELLE RESPONSIVE -->
<div id="live-reader-container">
    
    <!-- ZOOM BAR 20% STEP AVEC CENTRAGE ABSOLU -->
    <div id="reader-zoom-bar">
        <span>Zoom :</span>
        <button class="btn-zoom-step" onclick="stepZoom(-0.20)">−</button>
        <span id="zoom-percentage-txt" style="color:#dfb256; min-width:44px; text-align:center;">100%</span>
        <button class="btn-zoom-step" onclick="stepZoom(0.20)">+</button>
        <button class="btn-mode-pill" onclick="resetZoomDefault()">1:1 Centré</button>
    </div>

    <!-- SIDE ARROWS SUR GRAND ÉCRAN -->
    <div class="nav-side-arrow nav-arrow-left" onclick="prevStep()" title="Page précédente">❮</div>
    <div class="nav-side-arrow nav-arrow-right" onclick="nextStep()" title="Page suivante">❯</div>

    <div id="reader-scroll-viewport">
        <div id="spread-card-wrapper">
            <div id="binding-shadow" class="spread-binding-shadow" style="display:none;"></div>
            <canvas id="page-canvas-left" class="canvas-page-half" style="display:none;"></canvas>
            <canvas id="page-canvas-right" class="canvas-page-half" style="display:none;"></canvas>
            <canvas id="page-canvas-single" class="canvas-page-single"></canvas>
        </div>
    </div>

    <!-- TAP ZONES POUR MOBILE -->
    <div class="tap-zones-layer">
        <div class="tap-zone-l" onclick="prevStep()"></div>
        <div style="flex:1;"></div>
        <div class="tap-zone-r" onclick="nextStep()"></div>
    </div>

    <!-- FIXED BOTTOM DOCK -->
    <div id="m-bottom-dock">
        <button class="dock-nav-btn" onclick="prevStep()">◀</button>
        <input type="range" id="page-scrubber" class="dock-slider-bar" min="1" max="168" value="1" oninput="onScrubPage(this.value)" />
        <span id="page-indicator-txt">Couverture</span>
        <button class="dock-nav-btn" onclick="nextStep()">▶</button>
    </div>
</div>

<!-- BOOKMARKS MODAL -->
<div id="bookmarks-dialog-overlay">
    <div class="dialog-box">
        <div style="font-size:28px; margin-bottom:6px;">🔖</div>
        <h3 style="font-size:16px; color:#dfb256; text-transform:uppercase;">Mes Marque-Pages</h3>
        <p style="font-size:11px; color:#889bb8; margin-bottom:12px;">Accédez instantanément à vos pages</p>
        <div class="dialog-list" id="dialog-bm-items"></div>
        <button onclick="closeBookmarksList()" style="background:#dfb256; color:#111; font-weight:800; font-size:12px; padding:9px 22px; border-radius:20px; border:none; cursor:pointer; width:100%;">Fermer ✕</button>
    </div>
</div>

<script>
const STORAGE_KEY = "LES_9_ETAGES_APP_STORAGE_UNIVERSAL_V1";

let currentSide = 'terrain'; // 'terrain' or 'sommet'
let currentPage = 1; // 1 to 168 (1 = Couverture, 2 = Page 1)
let isReading = false;

let renderTaskLeft = null;
let renderTaskRight = null;
let renderTaskSingle = null;
let resizeDebounceTimer = null;

async function cancelPendingRenders() {
    if (renderTaskLeft) { try { renderTaskLeft.cancel(); } catch(e){} renderTaskLeft = null; }
    if (renderTaskRight) { try { renderTaskRight.cancel(); } catch(e){} renderTaskRight = null; }
    if (renderTaskSingle) { try { renderTaskSingle.cancel(); } catch(e){} renderTaskSingle = null; }
}

function handleWindowResize() {
    if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    if (isReading) {
        clearTimeout(resizeDebounceTimer);
        resizeDebounceTimer = setTimeout(() => {
            renderUniversalReader();
        }, 120);
    }
}

let zoomFactor = 1.0; // 1.0 = 100%, 1.2 = 120%, 0.8 = 80%, etc.
let forceLayout = 'auto'; // 'auto', 'single', 'double'

let docTerrain = null;
let docSommet = null;

// Three.js
let scene, camera, renderer, bookMesh;
let isFlipping3D = false;
let isTouchDragging = false;
let prevTouchPos = { x: 0, y: 0 };

let userStore = {
    terrainLastPage: 1,
    sommetLastPage: 1,
    terrainBookmarks: [],
    sommetBookmarks: [],
    zoom: 1.0,
    lastSide: 'terrain'
};

function loadUserStore() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            userStore = JSON.parse(saved);
            currentSide = userStore.lastSide || 'terrain';
            currentPage = (currentSide === 'terrain') ? (userStore.terrainLastPage || 1) : (userStore.sommetLastPage || 1);
            zoomFactor = userStore.zoom || 1.0;
        } catch(e) {}
    }
}

function saveUserStore() {
    if (currentSide === 'terrain') userStore.terrainLastPage = currentPage;
    else userStore.sommetLastPage = currentPage;
    userStore.lastSide = currentSide;
    userStore.zoom = zoomFactor;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(userStore));
    updateBookmarkUI();
}

function isDoublePageMode() {
    if (forceLayout === 'double') return true;
    if (forceLayout === 'single') return false;
    // Auto detection: Double page if screen width >= 860px and window is landscape
    return (window.innerWidth >= 860 && window.innerWidth > window.innerHeight);
}

function init3DStage() {
    const container = document.getElementById('stage-3d-box');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 9.2);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const lKey = new THREE.DirectionalLight(0xffffff, 0.95);
    lKey.position.set(5, 8, 7); scene.add(lKey);
    const lRim = new THREE.DirectionalLight(0xdfb256, 0.6);
    lRim.position.set(-5, -4, 5); scene.add(lRim);

    const geometry = new THREE.BoxGeometry(3.2, 4.5, 0.52);
    const loader = new THREE.TextureLoader();
    const tCover = loader.load(window.BOOK_DATA.terrainCover);
    const sCover = loader.load(window.BOOK_DATA.sommetCover);
    sCover.center.set(0.5, 0.5);
    sCover.rotation = Math.PI;

    const canvasP = document.createElement('canvas');
    canvasP.width = 128; canvasP.height = 512;
    const ctxP = canvasP.getContext('2d');
    ctxP.fillStyle = '#f6f0df'; ctxP.fillRect(0,0,128,512);
    ctxP.fillStyle = '#d8cca8';
    for(let i=0; i<512; i+=4) ctxP.fillRect(0, i, 128, 1.5);
    const pTex = new THREE.CanvasTexture(canvasP);

    const canvasS = document.createElement('canvas');
    canvasS.width = 256; canvasS.height = 1024;
    const ctxS = canvasS.getContext('2d');
    ctxS.fillStyle = '#111a2d'; ctxS.fillRect(0,0,256,512);
    ctxS.fillStyle = '#c35936'; ctxS.fillRect(0,512,256,512);
    ctxS.fillStyle = '#dfb256'; ctxS.font = 'bold 36px sans-serif'; ctxS.textAlign = 'center';
    
    ctxS.save(); ctxS.translate(128, 256); ctxS.rotate(Math.PI/2);
    ctxS.fillText("▲ SOMMET · 9 ÉTAGES", 0, 12); ctxS.restore();

    ctxS.save(); ctxS.translate(128, 768); ctxS.rotate(-Math.PI/2);
    ctxS.fillStyle = '#f7eedb'; ctxS.fillText("▲ TERRAIN · 9 ÉTAGES", 0, 12); ctxS.restore();
    const spineTex = new THREE.CanvasTexture(canvasS);

    const materials = [
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: spineTex }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: tCover, roughness: 0.35 }),
        new THREE.MeshStandardMaterial({ map: sCover, roughness: 0.35 })
    ];

    bookMesh = new THREE.Mesh(geometry, materials);
    bookMesh.rotation.set(0.15, -0.35, 0);
    scene.add(bookMesh);

    // FREE TOUCH TRACKBALL (360° SANS BLOCAGE)
    const dom = renderer.domElement;
    dom.addEventListener('pointerdown', (e) => {
        isTouchDragging = true;
        prevTouchPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
        if (!isTouchDragging) return;
        const deltaX = e.clientX - prevTouchPos.x;
        const deltaY = e.clientY - prevTouchPos.y;

        const deltaQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(
            deltaY * 0.008,
            deltaX * 0.008,
            0,
            'XYZ'
        ));
        bookMesh.quaternion.multiplyQuaternions(deltaQuat, bookMesh.quaternion);
        prevTouchPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => { isTouchDragging = false; });

    window.addEventListener('resize', handleWindowResize);

    animate3DLoop();
    initAppCore();
}

function animate3DLoop(time) {
    requestAnimationFrame(animate3DLoop);
    TWEEN.update(time);
    if (!isFlipping3D && bookMesh && !isReading) {
        bookMesh.position.y = Math.sin(time * 0.0015) * 0.08;
    }
    renderer.render(scene, camera);
}

async function initAppCore() {
    loadUserStore();
    docTerrain = await pdfjsLib.getDocument('terrain.pdf').promise;
    docSommet = await pdfjsLib.getDocument('sommet.pdf').promise;
    updateSideBadge();
    setupTouchGestures();
    setupPanDrag();
    setupAutoFadeListeners();
}

// RENDU HAUTE FIDÉLITÉ UNIVERSEL SANS RATATINAGE
async function renderUniversalReader() {
    await cancelPendingRenders();
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    if (!activeDoc) return;

    const isDouble = isDoublePageMode();
    const pLabel = (currentPage === 1) ? "Couverture" : (isDouble ? `p. ${currentPage - 1}-${currentPage} / 167` : `p. ${currentPage - 1} / 167`);
    
    document.getElementById('page-scrubber').value = currentPage;
    document.getElementById('page-indicator-txt').innerText = pLabel;
    document.getElementById('zoom-percentage-txt').innerText = `${Math.round(zoomFactor * 100)}%`;

    const wrapper = document.getElementById('spread-card-wrapper');
    const cLeft = document.getElementById('page-canvas-left');
    const cRight = document.getElementById('page-canvas-right');
    const cSingle = document.getElementById('page-canvas-single');
    const shadow = document.getElementById('binding-shadow');

    const screenW = window.innerWidth;
    const availH = window.innerHeight - 56 - 65; // Available height inside viewport

    if (isDouble && currentPage > 1) {
        // --- MODE DOUBLE PAGE SUR PC / TABLETTE PAYSAGE ---
        cSingle.style.display = 'none';
        cLeft.style.display = 'block';
        cRight.style.display = 'block';
        shadow.style.display = 'block';

        const pLeftNum = (currentPage % 2 === 0) ? currentPage : currentPage - 1;
        const pRightNum = pLeftNum + 1;

        const pageLeft = await activeDoc.getPage(Math.max(1, pLeftNum));
        const pageRight = (pRightNum <= activeDoc.numPages) ? await activeDoc.getPage(pRightNum) : null;

        // Calculate double page width based on height
        const targetDoubleH = availH * 0.90 * zoomFactor;
        const targetDoubleW = targetDoubleH * (2 * 148 / 210);
        const singleW = targetDoubleW / 2;

        const scale = (singleW / (pageLeft.view[2] - pageLeft.view[0])) * 2.0;

        const vpL = pageLeft.getViewport({ scale: scale });
        cLeft.width = vpL.width; cLeft.height = vpL.height;
        await pageLeft.render({ canvasContext: cLeft.getContext('2d'), viewport: vpL }).promise;

        if (pageRight) {
            const vpR = pageRight.getViewport({ scale: scale });
            cRight.width = vpR.width; cRight.height = vpR.height;
            await pageRight.render({ canvasContext: cRight.getContext('2d'), viewport: vpR }).promise;
        }

        wrapper.style.width = targetDoubleW + 'px';
        wrapper.style.height = targetDoubleH + 'px';
        cLeft.style.width = (targetDoubleW / 2) + 'px';
        cLeft.style.height = targetDoubleH + 'px';
        cRight.style.width = (targetDoubleW / 2) + 'px';
        cRight.style.height = targetDoubleH + 'px';
    } else {
        // --- MODE PAGE SIMPLE SUR MOBILE PORTRAIT ---
        cLeft.style.display = 'none';
        cRight.style.display = 'none';
        shadow.style.display = 'none';
        cSingle.style.display = 'block';

        const page = await activeDoc.getPage(currentPage);
        
        // Fit width on smartphone (92% of screen width) multiplied by zoomFactor
        const targetSingleW = (screenW * 0.92) * zoomFactor;
        const targetSingleH = targetSingleW * (210 / 148); // A5 Aspect ratio (148 x 210 mm)

        const scale = (targetSingleW / (page.view[2] - page.view[0])) * 2.2;
        const vp = page.getViewport({ scale: scale });

        cSingle.width = vp.width; cSingle.height = vp.height;
        await page.render({ canvasContext: cSingle.getContext('2d'), viewport: vp }).promise;

        wrapper.style.width = targetSingleW + 'px';
        wrapper.style.height = targetSingleH + 'px';
        cSingle.style.width = targetSingleW + 'px';
        cSingle.style.height = targetSingleH + 'px';
    }

    saveUserStore();
}

// ZOOM PAR PALIERS DE 20% (DE 60% À 220% AVEC CENTRAGE ABSOLU)

// DRAG-TO-PAN (GLISSER-DÉPLACER À LA SOURIS / AU DOIGT SUR PAGE ZOOMÉE)
let isPanning = false;
let startPanX = 0, startPanY = 0;
let scrollStartLeft = 0, scrollStartTop = 0;


// GESTION DU REPOS ET DU RÉVEIL DES BOUTONS DE COMMANDE
let idleFadeTimer = null;

function wakeControls() {
    const zoomBar = document.getElementById('reader-zoom-bar');
    const bottomDock = document.getElementById('m-bottom-dock');
    const sideArrows = document.querySelectorAll('.nav-side-arrow');
    const header = document.getElementById('m-header');

    if (zoomBar) zoomBar.classList.add('ui-active');
    if (bottomDock) bottomDock.classList.add('ui-active');
    if (header) header.classList.add('ui-active');
    sideArrows.forEach(a => a.classList.add('ui-active'));

    clearTimeout(idleFadeTimer);
    idleFadeTimer = setTimeout(() => {
        if (zoomBar) zoomBar.classList.remove('ui-active');
        if (bottomDock) bottomDock.classList.remove('ui-active');
        if (header) header.classList.remove('ui-active');
        sideArrows.forEach(a => a.classList.remove('ui-active'));
    }, 2800); // Se rend quasi invisible après 2.8s d'inactivité
}

function setupAutoFadeListeners() {
    window.addEventListener('mousemove', wakeControls);
    window.addEventListener('touchstart', wakeControls, { passive: true });
    window.addEventListener('touchmove', wakeControls, { passive: true });
    window.addEventListener('scroll', wakeControls, { passive: true });
    window.addEventListener('keydown', wakeControls);
    wakeControls();
}

function setupPanDrag() {
    const vp = document.getElementById('reader-scroll-viewport');

    // Mouse Drag
    vp.addEventListener('mousedown', (e) => {
        // Only pan if zoomed or content exceeds viewport
        if (vp.scrollHeight > vp.clientHeight || vp.scrollWidth > vp.clientWidth) {
            isPanning = true;
            vp.classList.add('is-dragging');
            startPanX = e.pageX - vp.offsetLeft;
            startPanY = e.pageY - vp.offsetTop;
            scrollStartLeft = vp.scrollLeft;
            scrollStartTop = vp.scrollTop;
        }
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        e.preventDefault();
        const vp = document.getElementById('reader-scroll-viewport');
        const x = e.pageX - vp.offsetLeft;
        const y = e.pageY - vp.offsetTop;
        const walkX = (x - startPanX) * 1.5;
        const walkY = (y - startPanY) * 1.5;
        vp.scrollLeft = scrollStartLeft - walkX;
        vp.scrollTop = scrollStartTop - walkY;
    });

    window.addEventListener('mouseup', () => {
        isPanning = false;
        const vp = document.getElementById('reader-scroll-viewport');
        if (vp) vp.classList.remove('is-dragging');
    });

    // Touch Drag (Sur Mobile/Tablette avec 1 doigt)
    let touchStartX = 0, touchStartY = 0;
    vp.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            touchStartX = e.touches[0].pageX;
            touchStartY = e.touches[0].pageY;
            scrollStartLeft = vp.scrollLeft;
            scrollStartTop = vp.scrollTop;
        }
    }, { passive: true });

    vp.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
            const touchX = e.touches[0].pageX;
            const touchY = e.touches[0].pageY;
            const deltaX = touchX - touchStartX;
            const deltaY = touchY - touchStartY;
            vp.scrollLeft = scrollStartLeft - deltaX;
            vp.scrollTop = scrollStartTop - deltaY;
        }
    }, { passive: true });
}

function stepZoom(delta) {
    wakeControls();
    zoomFactor = Math.max(0.70, Math.min(2.40, +(zoomFactor + delta).toFixed(2)));
    renderUniversalReader();
}

function resetZoomDefault() {
    zoomFactor = 1.0;
    renderUniversalReader();
    document.getElementById('reader-scroll-viewport').scrollTop = 0;
    document.getElementById('reader-scroll-viewport').scrollLeft = 0;
}

function manualToggleLayout() {
    if (forceLayout === 'auto') forceLayout = 'single';
    else if (forceLayout === 'single') forceLayout = 'double';
    else forceLayout = 'auto';

    const btn = document.getElementById('btn-toggle-layout');
    btn.innerText = (forceLayout === 'auto') ? '📐 Auto' : (forceLayout === 'double' ? '📖 2 Pages' : '📄 1 Page');
    renderUniversalReader();
}

function nextStep() {
    wakeControls();
    const step = (isDoublePageMode() && currentPage > 1) ? 2 : 1;
    if (currentPage + step <= 168) {
        currentPage += step;
    } else if (currentPage < 168) {
        currentPage = 168;
    }
    renderUniversalReader();
}

function prevStep() {
    wakeControls();
    const step = (isDoublePageMode() && currentPage > 2) ? 2 : 1;
    if (currentPage - step >= 1) {
        currentPage -= step;
    } else {
        currentPage = 1;
    }
    renderUniversalReader();
}

function onScrubPage(val) {
    currentPage = parseInt(val);
    renderUniversalReader();
}

function flip3DTeteBeche() {
    if (isFlipping3D) return;
    isFlipping3D = true;

    currentSide = (currentSide === 'terrain') ? 'sommet' : 'terrain';
    currentPage = (currentSide === 'terrain') ? (userStore.terrainLastPage || 1) : (userStore.sommetLastPage || 1);

    const targetY = (currentSide === 'sommet') ? Math.PI - 0.35 : -0.35;
    const targetZ = (currentSide === 'sommet') ? Math.PI : 0;

    new TWEEN.Tween(bookMesh.rotation)
        .to({ y: targetY, z: targetZ, x: 0.15 }, 1200)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onComplete(() => { isFlipping3D = false; })
        .start();

    updateSideBadge();
    if (isReading) renderUniversalReader();
}

function updateSideBadge() {
    const b = document.getElementById('badge-side');
    if (currentSide === 'terrain') {
        b.className = "side-pill pill-terrain";
        b.innerText = "TERRAIN";
    } else {
        b.className = "side-pill pill-sommet";
        b.innerText = "SOMMET";
    }
}

function openReader() {
    isReading = true;
    document.getElementById('live-reader-container').style.display = 'flex';
    document.getElementById('home-3d-cta').style.display = 'none';
    renderUniversalReader();
}

function toggleCurrentBookmark() {
    const list = (currentSide === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const idx = list.indexOf(currentPage);
    const pLabel = (currentPage === 1) ? "Couverture" : `Page ${currentPage - 1}`;
    if (idx === -1) {
        list.push(currentPage);
        list.sort((a,b) => a - b);
        showToastAlert(`🔖 ${pLabel} mémorisée !`);
    } else {
        list.splice(idx, 1);
        showToastAlert(`Marque-page retiré`);
    }
    const vp = document.getElementById('reader-scroll-viewport');
    if (zoomFactor > 1.0) {
        vp.classList.add('is-zoomed');
    } else {
        vp.classList.remove('is-zoomed');
    }
    saveUserStore();
}

function updateBookmarkUI() {
    const list = (currentSide === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const isBm = list.includes(currentPage);
    
    const btn = document.getElementById('btn-save-bm');
    const label = document.getElementById('txt-bm-label');
    if (isBm) {
        btn.classList.add('active-bm');
        label.innerText = "Mémorisée ★";
    } else {
        btn.classList.remove('active-bm');
        label.innerText = "Marquer";
    }

    const total = (userStore.terrainBookmarks || []).length + (userStore.sommetBookmarks || []).length;
    document.getElementById('txt-bm-total').innerText = `Pages (${total})`;
}

function openBookmarksList() {
    const c = document.getElementById('dialog-bm-items');
    c.innerHTML = '';
    
    const all = [];
    (userStore.terrainBookmarks || []).forEach(p => all.push({ side: 'terrain', page: p }));
    (userStore.sommetBookmarks || []).forEach(p => all.push({ side: 'sommet', page: p }));

    if (all.length === 0) {
        c.innerHTML = '<div style="font-size:12px; color:#888; text-align:center; padding:15px;">Aucun marque-page enregistré.</div>';
    } else {
        all.forEach(item => {
            const row = document.createElement('div');
            row.className = 'dialog-item';
            const badgeBg = (item.side === 'terrain') ? '#c35936' : '#133968';
            const pTxt = (item.page === 1) ? "Couverture" : `Page ${item.page - 1}`;
            row.innerHTML = `
                <div onclick="jumpToBm('${item.side}', ${item.page})" style="display:flex; align-items:center; gap:8px; flex:1;">
                    <span style="background:${badgeBg}; color:#fff; font-size:9px; font-weight:800; padding:2px 6px; border-radius:8px; text-transform:uppercase;">${item.side}</span>
                    <span style="font-size:13px; font-weight:700; color:#f7eedb;">${pTxt}</span>
                </div>
                <button onclick="delBmItem('${item.side}', ${item.page}, event)" style="background:transparent; border:none; color:#e74c3c; font-size:14px; cursor:pointer;">🗑️</button>
            `;
            c.appendChild(row);
        });
    }

    document.getElementById('bookmarks-dialog-overlay').style.display = 'flex';
}

function closeBookmarksList() {
    document.getElementById('bookmarks-dialog-overlay').style.display = 'none';
}

function jumpToBm(side, pageNum) {
    closeBookmarksList();
    currentSide = side;
    currentPage = pageNum;
    updateSideBadge();
    if (!isReading) openReader();
    else renderUniversalReader();
}

function delBmItem(side, pageNum, event) {
    event.stopPropagation();
    const list = (side === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const idx = list.indexOf(pageNum);
    if (idx !== -1) {
        list.splice(idx, 1);
        saveUserStore();
        openBookmarksList();
    }
}

function showToastAlert(txt) {
    const t = document.getElementById('toast-box');
    t.innerText = txt; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2200);
}

function setupTouchGestures() {
    let tStartX = 0, tEndX = 0;
    const reader = document.getElementById('live-reader-container');
    reader.addEventListener('touchstart', (e) => {
        tStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    reader.addEventListener('touchend', (e) => {
        tEndX = e.changedTouches[0].screenX;
        const diff = tEndX - tStartX;
        if (diff < -50) nextStep();
        if (diff > 50) prevStep();
    }, { passive: true });
}

window.onload = init3DStage;
</script>
