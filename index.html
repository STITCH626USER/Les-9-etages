<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #040711; font-family: 'Plus Jakarta Sans', sans-serif;
    color: #f7eedb; user-select: none; -webkit-tap-highlight-color: transparent;
}

/* =================================================== */
/* 📱 HEADER SUPÉRIEUR FLUIDE & SCROLLABLE / SWIPABLE */
/* =================================================== */
#m-header {
    height: 58px; width: 100%; background: #0c1220;
    border-bottom: 1px solid rgba(255,255,255,0.14);
    display: flex; align-items: center;
    padding: 0 10px; position: fixed; top: 0; left: 0; z-index: 500;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
#m-header::-webkit-scrollbar { display: none; }

.header-inner-track {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; min-width: max-content; gap: 12px;
}

.brand-zone { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.title-row { display: flex; align-items: center; gap: 6px; }
.title-txt {
    font-family: 'Cinzel', serif; font-size: 14px; font-weight: 900;
    letter-spacing: 0.5px; color: #f7eedb; white-space: nowrap;
}
.author-txt {
    font-size: 10.5px; font-weight: 700; color: #dfb256; letter-spacing: 0.3px;
}
.side-pill {
    padding: 3px 8px; border-radius: 10px; font-size: 9.5px; font-weight: 900;
    text-transform: uppercase;
}
.pill-terrain { background: #c35936; color: #fff; }
.pill-sommet { background: #133968; color: #dfb256; }

.header-btns { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.btn-h {
    background: #182236; border: 1.5px solid rgba(255,255,255,0.25);
    color: #f7eedb; padding: 7px 12px; border-radius: 16px; font-size: 12px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; gap: 5px; min-height: 36px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4); white-space: nowrap;
}
.btn-h.active-bm { background: #dfb256; color: #111; font-weight: 900; border-color: #dfb256; }
.btn-flip-act {
    background: linear-gradient(135deg, #c35936 0%, #dfb256 100%);
    color: #111; font-weight: 900; font-size: 12px; border: none;
    padding: 8px 14px; border-radius: 16px; cursor: pointer; min-height: 36px;
    box-shadow: 0 3px 12px rgba(223, 178, 86, 0.4); white-space: nowrap;
}

/* =================================================== */
/* 🧊 SCÈNE 3D & BOUTON OUVRIR LE LIVRE (100% FIABLE) */
/* =================================================== */
#stage-3d-box {
    width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 10;
    touch-action: none; background: radial-gradient(circle at center, #10192e 0%, #040711 85%);
}

#home-3d-cta {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 360px; z-index: 60; text-align: center;
    display: flex; flex-direction: column; gap: 10px;
}
.cta-info-bubble {
    font-size: 12px; font-weight: 700; color: #889bb8;
    background: rgba(12,18,32,0.92); padding: 8px 16px; border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.2);
}
.cta-btn-main {
    background: #dfb256; color: #111; font-size: 16px; font-weight: 900;
    padding: 16px 32px; border-radius: 32px; border: none; cursor: pointer;
    box-shadow: 0 8px 25px rgba(223, 178, 86, 0.6); width: 100%;
}

/* =================================================== */
/* 📖 LISEUSE NUMÉRIQUE HAUTE FIDÉLITÉ */
/* =================================================== */
#live-reader-container {
    position: fixed; top: 58px; left: 0; width: 100vw; height: calc(100vh - 58px);
    display: none; justify-content: center; align-items: center;
    background: #040711; z-index: 90; overflow: hidden;
}

#reader-scroll-viewport {
    width: 100%; height: 100%;
    overflow-y: auto; overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    display: flex; justify-content: center; align-items: center;
    padding: 60px 8px 75px 8px;
}

#spread-card-wrapper {
    background: #ffffff; border-radius: 6px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.95);
    position: relative; margin: auto;
    flex-shrink: 0;
}
.canvas-page-single { display: block; width: 100%; height: auto; border-radius: 6px; }

/* ZOOM TOOLBAR (UNE SEULE LIGNE HORIZONTALE) */
#reader-zoom-bar {
    position: fixed; top: 66px; left: 50%; transform: translateX(-50%);
    background: #0e1628;
    border: 1.5px solid rgba(255,255,255,0.25); border-radius: 25px;
    padding: 5px 14px; display: flex; align-items: center; justify-content: center; gap: 10px;
    z-index: 120; font-size: 13px; font-weight: 800;
    box-shadow: 0 8px 25px rgba(0,0,0,0.85);
    white-space: nowrap; width: auto; max-width: 94%;
    opacity: 0.25; transition: opacity 0.4s ease;
}
#reader-zoom-bar:hover, #reader-zoom-bar.dock-awake { opacity: 1 !important; }

.btn-zoom-step {
    background: #1b263e; border: 1.5px solid rgba(255,255,255,0.3);
    color: #dfb256; width: 32px; height: 32px; border-radius: 8px; font-size: 18px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
}
#zoom-percentage-txt { color: #dfb256; font-size: 13px; font-weight: 900; min-width: 44px; text-align: center; }
.btn-mode-pill {
    background: #1b263e; border: 1.5px solid rgba(255,255,255,0.25);
    color: #f7eedb; font-size: 11px; font-weight: 800; padding: 6px 12px; border-radius: 14px;
    cursor: pointer; min-height: 32px; display: flex; align-items: center;
}

/* DOCK INFÉRIEUR HARMONIEUX (FLUIDE SANS DÉBORDEMENT) */
#m-bottom-dock {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: 92%; max-width: 420px; height: 50px;
    background: #0c1220;
    border: 1.5px solid rgba(255,255,255,0.25); border-radius: 25px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 12px; z-index: 150;
    box-shadow: 0 10px 30px rgba(0,0,0,0.95);
    opacity: 0.25; transition: opacity 0.4s ease;
}
#m-bottom-dock:hover, #m-bottom-dock.dock-awake { opacity: 1 !important; }

.dock-nav-btn {
    background: #1b263e; border: 1.5px solid rgba(255,255,255,0.28);
    color: #f7eedb; padding: 7px 13px; border-radius: 14px; font-size: 14px; font-weight: 900;
    cursor: pointer; min-width: 40px; min-height: 34px; display: flex; align-items: center; justify-content: center;
}
.dock-slider-bar {
    flex: 1; margin: 0 10px; -webkit-appearance: none; appearance: none;
    height: 5px; border-radius: 5px; background: rgba(255,255,255,0.25); outline: none;
}
.dock-slider-bar::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: #dfb256; cursor: pointer;
    box-shadow: 0 0 10px rgba(223, 178, 86, 0.9);
}
#page-indicator-txt { font-size: 12px; font-weight: 900; color: #dfb256; min-width: 85px; text-align: center; white-space: nowrap; }

/* MODAL MARQUE-PAGES PLEIN FORMAT */
#bookmarks-dialog-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(4, 6, 12, 0.90); backdrop-filter: blur(25px);
    display: none; justify-content: center; align-items: center; z-index: 999;
    padding: 16px;
}
.dialog-box {
    background: #0f1628; border: 2px solid rgba(255,255,255,0.25);
    border-radius: 24px; padding: 26px 18px; width: 92%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.98); text-align: center;
}
.dialog-box-icon { font-size: 38px; margin-bottom: 8px; display: block; }
.dialog-box-title { font-size: 19px; font-weight: 900; color: #dfb256; text-transform: uppercase; }
.dialog-box-sub { font-size: 13px; font-weight: 700; color: #9ab0d0; margin-top: 4px; margin-bottom: 16px; }
.dialog-list { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin: 16px 0; text-align: left; }
.dialog-item {
    background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.18);
    padding: 12px 14px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; min-height: 50px;
}
.dialog-badge-side { font-size: 11px; font-weight: 900; padding: 4px 8px; border-radius: 10px; text-transform: uppercase; }
.dialog-page-label { font-size: 15px; font-weight: 800; color: #f7eedb; }
.btn-dialog-close {
    background: #dfb256; color: #111; font-weight: 900; font-size: 15px;
    padding: 14px 28px; border-radius: 25px; border: none; cursor: pointer; width: 100%;
    margin-top: 10px;
}

#toast-box {
    position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
    background: #dfb256; color: #111; font-weight: 900; font-size: 13px;
    padding: 9px 22px; border-radius: 25px; display: none; z-index: 1000;
    box-shadow: 0 8px 25px rgba(0,0,0,0.7);
}
</style>
</head>
<body>

<div id="toast-box">Page mémorisée !</div>

<!-- TOP HEADER AVEC DÉFILEMENT / SWIPE HORIZONTAL FLUIDE -->
<div id="m-header">
    <div class="header-inner-track">
        <div class="brand-zone">
            <div class="title-row">
                <span class="title-txt">9 ÉTAGES</span>
                <span id="badge-side" class="side-pill pill-terrain">TERRAIN</span>
            </div>
            <span class="author-txt">Alexandre R.</span>
        </div>

        <div class="header-btns">
            <button id="btn-save-bm" class="btn-h" onclick="toggleCurrentBookmark()">🔖 <span id="txt-bm-label">Marquer</span></button>
            <button class="btn-h" onclick="openBookmarksList()">📂 Marque-pages</button>
            <button class="btn-flip-act" onclick="flip3DTeteBeche()">🔄 RETOURNER</button>
        </div>
    </div>
</div>

<!-- SCÈNE 3D DE L'ACCUEIL -->
<div id="stage-3d-box"></div>

<!-- BOUTON OUVRIR LE LIVRE DE L'ACCUEIL -->
<div id="home-3d-cta">
    <div class="cta-info-bubble">
        👆 Touchez & glissez pour manipuler à 360°
    </div>
    <button class="cta-btn-main" onclick="openReader()">
        OUVRIR LE LIVRE ➔
    </button>
</div>

<!-- LISEUSE PLEIN FORMAT -->
<div id="live-reader-container">
    
    <!-- ZOOM TOOLBAR AVEC CHOIX 1 PAGE / 2 PAGES SUR GRAND ÉCRAN & ZOOM MAX 150% -->
    <div id="reader-zoom-bar">
        <button id="btn-page-mode" class="btn-mode-pill" onclick="toggleDisplayMode()">📖 2 Pages</button>
        <span style="white-space:nowrap; margin-left:4px;">Zoom :</span>
        <button class="btn-zoom-step" onclick="stepZoom(-0.15)">−</button>
        <span id="zoom-percentage-txt">100%</span>
        <button class="btn-zoom-step" onclick="stepZoom(0.15)">+</button>
        <button class="btn-mode-pill" onclick="resetZoomDefault()">1:1 Centré</button>
    </div>
    <div id="reader-scroll-viewport">
        <div id="spread-card-wrapper">
            <canvas id="page-canvas-left" class="canvas-page"></canvas>
            <canvas id="page-canvas-right" class="canvas-page"></canvas>
        </div>
    </div>
    </div>
    <!-- DOCK INFÉRIEUR -->
    <div id="m-bottom-dock">
        <button class="dock-nav-btn" onclick="prevStep()">◀</button>
        <input type="range" id="page-scrubber" class="dock-slider-bar" min="1" max="170" value="1" oninput="onScrubPage(this.value)" />
        <span id="page-indicator-txt">Couverture</span>
        <button class="dock-nav-btn" onclick="nextStep()">▶</button>
    </div>
</div>

<!-- MODAL MARQUE-PAGES -->
<div id="bookmarks-dialog-overlay">
    <div class="dialog-box">
        <span class="dialog-box-icon">🔖</span>
        <h3 class="dialog-box-title">Mes Marque-Pages</h3>
        <p class="dialog-box-sub">Accédez instantanément à vos pages</p>
        <div class="dialog-list" id="dialog-bm-items"></div>
        <button class="btn-dialog-close" onclick="closeBookmarksList()">Fermer ✕</button>
    </div>
</div>

<script>
const STORAGE_KEY = "LES_9_ETAGES_APP_STORAGE_MASTER_V3";

let currentSide = 'terrain';
let currentPage = 1;
let isReading = false;
let zoomFactor = 1.0;

let docTerrain = null;
let docSommet = null;

let scene, camera, renderer, bookMesh;
let isFlipping3D = false;
let isTouchDragging = false;
let prevTouchPos = { x: 0, y: 0 };
let renderTaskSingle = null;
let dockFadeTimeout = null;

let userStore = {
    terrainLastPage: 1,
    sommetLastPage: 1,
    terrainBookmarks: [],
    sommetBookmarks: [],
    lastSide: 'terrain'
};

function loadUserStore() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        try {
            userStore = JSON.parse(saved);
            currentSide = userStore.lastSide || 'terrain';
            currentPage = (currentSide === 'terrain') ? (userStore.terrainLastPage || 1) : (userStore.sommetLastPage || 1);
        } catch(e) {}
    } else {
        currentSide = 'terrain';
        currentPage = 1;
    }
    updateBookmarkUI();
}

function saveUserStore() {
    if (currentSide === 'terrain') userStore.terrainLastPage = currentPage;
    else userStore.sommetLastPage = currentPage;
    userStore.lastSide = currentSide;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(userStore));
    updateBookmarkUI();
}

function init3DStage() {
    const container = document.getElementById('stage-3d-box');
    if (!container) return;
    container.innerHTML = '';

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 9.2);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const lKey = new THREE.DirectionalLight(0xffffff, 1.1);
    lKey.position.set(5, 8, 7); scene.add(lKey);
    const lRim = new THREE.DirectionalLight(0xdfb256, 0.8);
    lRim.position.set(-5, -4, 5); scene.add(lRim);

    const geometry = new THREE.BoxGeometry(3.2, 4.5, 0.52);
    const loader = new THREE.TextureLoader();
    const tCover = loader.load(window.BOOK_DATA.terrainCover, () => { if (renderer && scene && camera) renderer.render(scene, camera); });
    const sCover = loader.load(window.BOOK_DATA.sommetCover, () => { if (renderer && scene && camera) renderer.render(scene, camera); });
    sCover.center.set(0.5, 0.5);
    sCover.rotation = Math.PI;

    const canvasP = document.createElement('canvas');
    canvasP.width = 128; canvasP.height = 512;
    const ctxP = canvasP.getContext('2d');
    ctxP.fillStyle = '#f6f0df'; ctxP.fillRect(0,0,128,512);
    ctxP.fillStyle = '#d8cca8';
    for(let i=0; i<512; i+=4) ctxP.fillRect(0, i, 128, 1.5);
    const pTex = new THREE.CanvasTexture(canvasP);

    const canvasS = document.createElement('canvas');
    canvasS.width = 256; canvasS.height = 1024;
    const ctxS = canvasS.getContext('2d');
    ctxS.fillStyle = '#111a2d'; ctxS.fillRect(0,0,256,512);
    ctxS.fillStyle = '#c35936'; ctxS.fillRect(0,512,256,512);
    ctxS.fillStyle = '#dfb256'; ctxS.font = 'bold 36px sans-serif'; ctxS.textAlign = 'center';
    
    ctxS.save(); ctxS.translate(128, 256); ctxS.rotate(Math.PI/2);
    ctxS.fillText("▲ SOMMET · 9 ÉTAGES", 0, 12); ctxS.restore();

    ctxS.save(); ctxS.translate(128, 768); ctxS.rotate(-Math.PI/2);
    ctxS.fillStyle = '#f7eedb'; ctxS.fillText("▲ TERRAIN · 9 ÉTAGES", 0, 12); ctxS.restore();
    const spineTex = new THREE.CanvasTexture(canvasS);

    const materials = [
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: spineTex }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: pTex }),
        new THREE.MeshStandardMaterial({ map: tCover, roughness: 0.35 }),
        new THREE.MeshStandardMaterial({ map: sCover, roughness: 0.35 })
    ];

    bookMesh = new THREE.Mesh(geometry, materials);
    if (currentSide === 'sommet') {
        bookMesh.rotation.set(0.15, Math.PI - 0.35, Math.PI);
    } else {
        bookMesh.rotation.set(0.15, -0.35, 0);
    }
    scene.add(bookMesh);

    const dom = renderer.domElement;
    dom.addEventListener('pointerdown', (e) => {
        isTouchDragging = true;
        prevTouchPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointermove', (e) => {
        if (!isTouchDragging || !bookMesh) return;
        const deltaX = e.clientX - prevTouchPos.x;
        const deltaY = e.clientY - prevTouchPos.y;

        const deltaQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(
            deltaY * 0.008,
            deltaX * 0.008,
            0,
            'XYZ'
        ));
        bookMesh.quaternion.multiplyQuaternions(deltaQuat, bookMesh.quaternion);
        prevTouchPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', () => { isTouchDragging = false; });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (isReading) renderUniversalReader();
    });

    animate3DLoop();
    initAppCore();
}

function animate3DLoop(time) {
    requestAnimationFrame(animate3DLoop);
    if (typeof TWEEN !== 'undefined') TWEEN.update(time);
    if (!isFlipping3D && bookMesh && !isReading && !isTouchDragging) {
        bookMesh.position.y = Math.sin(time * 0.0015) * 0.08;
    }
    if (renderer && scene && camera) {
        renderer.render(scene, camera);
    }
}

async function initAppCore() {
    loadUserStore();
    updateSideBadge();
    docTerrain = await pdfjsLib.getDocument('terrain.pdf').promise;
    docSommet = await pdfjsLib.getDocument('sommet.pdf').promise;
    updateSideBadge();
    updateBookmarkUI();
    initDockFadeListeners();
}

function wakeBottomDock() {
    const dock = document.getElementById('m-bottom-dock');
    const zoom = document.getElementById('reader-zoom-bar');
    if (dock) dock.classList.add('dock-awake');
    if (zoom) zoom.classList.add('dock-awake');
    
    clearTimeout(dockFadeTimeout);
    dockFadeTimeout = setTimeout(() => {
        if (dock) dock.classList.remove('dock-awake');
        if (zoom) zoom.classList.remove('dock-awake');
    }, 2800);
}

function initDockFadeListeners() {
    window.addEventListener('touchstart', wakeBottomDock, { passive: true });
    window.addEventListener('touchmove', wakeBottomDock, { passive: true });
    window.addEventListener('mousemove', wakeBottomDock);
    window.addEventListener('scroll', wakeBottomDock, { passive: true });
    wakeBottomDock();
}

let displayMode = (window.innerWidth > 900) ? 'spread' : 'single'; // 'single' ou 'spread' (2 pages)
let renderTaskLeft = null;
let renderTaskRight = null;

function toggleDisplayMode() {
    displayMode = (displayMode === 'single') ? 'spread' : 'single';
    const btn = document.getElementById('btn-page-mode');
    if (btn) btn.innerText = (displayMode === 'spread') ? '📄 1 Page' : '📖 2 Pages';
    renderUniversalReader();
}

function stepZoom(delta) {
    zoomFactor = Math.max(0.70, Math.min(1.50, +(zoomFactor + delta).toFixed(2)));
    renderUniversalReader();
}

function resetZoomDefault() {
    zoomFactor = 1.0;
    renderUniversalReader();
    const vp = document.getElementById('reader-scroll-viewport');
    if (vp) { vp.scrollTop = 0; vp.scrollLeft = 0; }
}

async function renderUniversalReader() {
    if (renderTaskLeft) { try { renderTaskLeft.cancel(); } catch(e){} renderTaskLeft = null; }
    if (renderTaskRight) { try { renderTaskRight.cancel(); } catch(e){} renderTaskRight = null; }
    
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    if (!activeDoc) return;

    const totalPages = activeDoc.numPages;
    const scrubber = document.getElementById('page-scrubber');
    if (scrubber) scrubber.max = totalPages;

    const isMobile = window.innerWidth <= 768;
    const effectiveMode = isMobile ? 'single' : displayMode;

    const isTwoPage = (effectiveMode === 'spread' && currentPage > 1 && currentPage < totalPages);
    
    let pLabel = "";
    if (currentPage === 1) pLabel = "Couverture";
    else if (isTwoPage) pLabel = `p. ${currentPage - 1}-${currentPage} / ${totalPages - 1}`;
    else pLabel = `p. ${currentPage - 1} / ${totalPages - 1}`;

    if (document.getElementById('page-scrubber')) document.getElementById('page-scrubber').value = currentPage;
    if (document.getElementById('page-indicator-txt')) document.getElementById('page-indicator-txt').innerText = pLabel;
    if (document.getElementById('zoom-percentage-txt')) document.getElementById('zoom-percentage-txt').innerText = `${Math.round(zoomFactor * 100)}%`;

    const wrapper = document.getElementById('spread-card-wrapper');
    const cLeft = document.getElementById('page-canvas-left');
    const cRight = document.getElementById('page-canvas-right');
    if (!wrapper || !cLeft || !cRight) return;

    try {
        const screenW = window.innerWidth;
        const availH = window.innerHeight - 58 - 50; // header - dock

        const pageL = await activeDoc.getPage(currentPage);
        const unscaledVp = pageL.getViewport({ scale: 1.0 });

        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

        if (!isTwoPage) {
            // MODE 1 SEULE PAGE
            cRight.style.display = 'none';
            cLeft.style.display = 'block';

            const maxFitW = screenW * 0.94;
            const maxFitH = availH * 0.92;

            let displayW = maxFitW;
            let displayH = displayW * (unscaledVp.height / unscaledVp.width);

            if (displayH > maxFitH) {
                displayH = maxFitH;
                displayW = displayH * (unscaledVp.width / unscaledVp.height);
            }

            displayW = displayW * zoomFactor;
            displayH = displayH * zoomFactor;

            const renderScale = (displayW / unscaledVp.width) * dpr;
            const vp = pageL.getViewport({ scale: renderScale });

            cLeft.width = vp.width;
            cLeft.height = vp.height;
            cLeft.style.width = `${Math.round(displayW)}px`;
            cLeft.style.height = `${Math.round(displayH)}px`;

            wrapper.style.width = `${Math.round(displayW)}px`;
            wrapper.style.height = `${Math.round(displayH)}px`;

            const ctxL = cLeft.getContext('2d');
            ctxL.imageSmoothingEnabled = true;
            ctxL.imageSmoothingQuality = 'high';
            renderTaskLeft = pageL.render({ canvasContext: ctxL, viewport: vp });
            await renderTaskLeft.promise;

        } else {
            // MODE 2 PAGES (DIPTYQUE WEB / DESKTOP)
            cRight.style.display = 'block';
            cLeft.style.display = 'block';

            const pageR = await activeDoc.getPage(currentPage + 1);

            const maxFitW = screenW * 0.92;
            const maxFitH = availH * 0.90;

            let displayH = maxFitH;
            let displaySingleW = displayH * (unscaledVp.width / unscaledVp.height);

            if (displaySingleW * 2 > maxFitW) {
                displaySingleW = maxFitW / 2;
                displayH = displaySingleW * (unscaledVp.height / unscaledVp.width);
            }

            displaySingleW = displaySingleW * zoomFactor;
            displayH = displayH * zoomFactor;

            const renderScale = (displaySingleW / unscaledVp.width) * dpr;
            const vpL = pageL.getViewport({ scale: renderScale });
            const vpR = pageR.getViewport({ scale: renderScale });

            cLeft.width = vpL.width;
            cLeft.height = vpL.height;
            cLeft.style.width = `${Math.round(displaySingleW)}px`;
            cLeft.style.height = `${Math.round(displayH)}px`;

            cRight.width = vpR.width;
            cRight.height = vpR.height;
            cRight.style.width = `${Math.round(displaySingleW)}px`;
            cRight.style.height = `${Math.round(displayH)}px`;

            wrapper.style.width = `${Math.round(displaySingleW * 2 + 4)}px`;
            wrapper.style.height = `${Math.round(displayH)}px`;

            const ctxL = cLeft.getContext('2d');
            const ctxR = cRight.getContext('2d');
            ctxL.imageSmoothingEnabled = true; ctxL.imageSmoothingQuality = 'high';
            ctxR.imageSmoothingEnabled = true; ctxR.imageSmoothingQuality = 'high';

            renderTaskLeft = pageL.render({ canvasContext: ctxL, viewport: vpL });
            renderTaskRight = pageR.render({ canvasContext: ctxR, viewport: vpR });
            await Promise.all([renderTaskLeft.promise, renderTaskRight.promise]);
        }
    } catch(err) {
        if (err.name !== 'RenderingCancelledException') {
            console.error("PDF Render Error:", err);
        }
    }

    saveUserStore();
}

function nextStep() {
    const activeDoc = (currentSide === 'terrain') ? docTerrain : docSommet;
    const maxP = activeDoc ? activeDoc.numPages : 170;
    const isMobile = window.innerWidth <= 768;
    const effectiveMode = isMobile ? 'single' : displayMode;
    const step = (effectiveMode === 'spread' && currentPage > 1 && currentPage < maxP - 1) ? 2 : 1;
    
    if (currentPage + step <= maxP) {
        currentPage += step;
        renderUniversalReader();
    } else if (currentPage < maxP) {
        currentPage = maxP;
        renderUniversalReader();
    }
}

function prevStep() {
    const isMobile = window.innerWidth <= 768;
    const effectiveMode = isMobile ? 'single' : displayMode;
    const step = (effectiveMode === 'spread' && currentPage > 2) ? 2 : 1;
    
    if (currentPage - step >= 1) {
        currentPage -= step;
        renderUniversalReader();
    } else if (currentPage > 1) {
        currentPage = 1;
        renderUniversalReader();
    }
}

function onScrubPage(val) {
    currentPage = parseInt(val);
    renderUniversalReader();
    wakeBottomDock();
}

function flip3DTeteBeche() {
    if (isFlipping3D) return;
    isFlipping3D = true;

    currentSide = (currentSide === 'terrain') ? 'sommet' : 'terrain';
    currentPage = (currentSide === 'terrain') ? (userStore.terrainLastPage || 1) : (userStore.sommetLastPage || 1);

    const targetY = (currentSide === 'sommet') ? Math.PI - 0.35 : -0.35;
    const targetZ = (currentSide === 'sommet') ? Math.PI : 0;

    new TWEEN.Tween(bookMesh.rotation)
        .to({ y: targetY, z: targetZ, x: 0.15 }, 1200)
        .easing(TWEEN.Easing.Cubic.InOut)
        .onComplete(() => { isFlipping3D = false; })
        .start();

    updateSideBadge();
    if (isReading) renderUniversalReader();
}

function updateSideBadge() {
    const b = document.getElementById('badge-side');
    if (currentSide === 'terrain') {
        b.className = "side-pill pill-terrain";
        b.innerText = "TERRAIN";
    } else {
        b.className = "side-pill pill-sommet";
        b.innerText = "SOMMET";
    }
}

async function openReader() {
    isReading = true;
    document.getElementById('live-reader-container').style.display = 'flex';
    document.getElementById('home-3d-cta').style.display = 'none';
    
    if (!docTerrain || !docSommet) {
        document.getElementById('page-indicator-txt').innerText = "Chargement...";
        if (!docTerrain) docTerrain = await pdfjsLib.getDocument('terrain.pdf').promise;
        if (!docSommet) docSommet = await pdfjsLib.getDocument('sommet.pdf').promise;
    }
    renderUniversalReader();
}

function toggleCurrentBookmark() {
    const list = (currentSide === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const idx = list.indexOf(currentPage);
    const pLabel = (currentPage === 1) ? "Couverture" : `Page ${currentPage - 1}`;
    if (idx === -1) {
        list.push(currentPage);
        list.sort((a,b) => a - b);
        showToastAlert(`🔖 ${pLabel} mémorisée !`);
    } else {
        list.splice(idx, 1);
        showToastAlert(`Marque-page retiré`);
    }
    saveUserStore();
}

function updateBookmarkUI() {
    const list = (currentSide === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const isBm = list.includes(currentPage);
    
    const btn = document.getElementById('btn-save-bm');
    const label = document.getElementById('txt-bm-label');
    if (isBm) {
        btn.classList.add('active-bm');
        label.innerText = "Mémorisée ★";
    } else {
        btn.classList.remove('active-bm');
        label.innerText = "Marquer";
    }
}

function openBookmarksList() {
    const c = document.getElementById('dialog-bm-items');
    c.innerHTML = '';
    
    const all = [];
    (userStore.terrainBookmarks || []).forEach(p => all.push({ side: 'terrain', page: p }));
    (userStore.sommetBookmarks || []).forEach(p => all.push({ side: 'sommet', page: p }));

    if (all.length === 0) {
        c.innerHTML = '<div style="font-size:14px; font-weight:700; color:#889bb8; text-align:center; padding:20px;">Aucun marque-page enregistré.<br><span style="font-size:12px; font-weight:600; opacity:0.8;">Utilisez le bouton 🔖 Marquer en cours de lecture.</span></div>';
    } else {
        all.forEach(item => {
            const row = document.createElement('div');
            row.className = 'dialog-item';
            const badgeBg = (item.side === 'terrain') ? '#c35936' : '#133968';
            const pTxt = (item.page === 1) ? "Couverture" : `Page ${item.page - 1}`;
            row.innerHTML = `
                <div onclick="jumpToBm('${item.side}', ${item.page})" style="display:flex; align-items:center; gap:10px; flex:1;">
                    <span class="dialog-badge-side" style="background:${badgeBg}; color:#fff;">${item.side}</span>
                    <span class="dialog-page-label">${pTxt}</span>
                </div>
                <button onclick="delBmItem('${item.side}', ${item.page}, event)" style="background:transparent; border:none; color:#ff5555; font-size:20px; padding:4px; cursor:pointer;" title="Supprimer">🗑️</button>
            `;
            c.appendChild(row);
        });
    }

    document.getElementById('bookmarks-dialog-overlay').style.display = 'flex';
}

function closeBookmarksList() {
    document.getElementById('bookmarks-dialog-overlay').style.display = 'none';
}

function jumpToBm(side, pageNum) {
    closeBookmarksList();
    currentSide = side;
    currentPage = pageNum;
    updateSideBadge();
    if (!isReading) openReader();
    else renderUniversalReader();
}

function delBmItem(side, pageNum, event) {
    event.stopPropagation();
    const list = (side === 'terrain') ? userStore.terrainBookmarks : userStore.sommetBookmarks;
    const idx = list.indexOf(pageNum);
    if (idx !== -1) {
        list.splice(idx, 1);
        saveUserStore();
        openBookmarksList();
    }
}

function showToastAlert(txt) {
    const t = document.getElementById('toast-box');
    t.innerText = txt; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2200);
}

window.onload = () => {
    init3DStage();
};
</script>
</body>
